# Stakater Reloader: rolls a workload when its referenced ConfigMap/Secret changes (opt-in per pod template, reloader.stakater.com/auto).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.21
    helm:
      releaseName: reloader
      values: |
        reloader:
          podMonitor:
            enabled: true
          # 14d (2026-11-08..2026-11-22): mem p95 58.7Mi, peak 93.5Mi -> 64Mi/128Mi; request = p95
          # rounded up to 64Mi (32Mi floor), limit = max(1.5x request, 1.25x peak); CPU requests only.
          deployment:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
  destination:
    namespace: reloader
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
