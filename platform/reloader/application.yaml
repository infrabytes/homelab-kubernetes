# Stakater Reloader: rolls a workload when its referenced ConfigMap/Secret changes (opt-in per pod template, reloader.stakater.com/auto).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader
    targetRevision: 2.2.18
    helm:
      releaseName: reloader
      values: |
        reloader:
          podMonitor:
            enabled: true
          # New component (2026-10-24): initial estimate; re-measure after two weeks.
          deployment:
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 96Mi
  destination:
    namespace: reloader
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
