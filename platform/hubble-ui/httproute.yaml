# LAN only: the A record points at the gateway L2 IP (RFC1918, unroutable
# publicly); TLS terminates at the gateway's hubble-https listener.
# The UI has no authentication of its own, so every request passes the authentik outpost first
# (authentik-outpost-hubble in platform/authentik serves /outpost.goauthentik.io on this host).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: hubble-https
  hostnames:
    - hubble.icaninto.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              group: ""
              kind: Service
              name: authentik-server
              namespace: authentik
              # The Service port, not the container port (80 -> 9000).
              port: 80
            http:
              path: /outpost.goauthentik.io/auth/envoy
              # Cookie carries the outpost session; the Host header is always sent.
              allowedHeaders:
                - cookie
                - user-agent
                - x-forwarded-for
                - x-forwarded-host
                - x-forwarded-proto
      backendRefs:
        - group: ""
          kind: Service
          name: hubble-ui
          port: 80
          weight: 1
