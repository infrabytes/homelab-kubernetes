apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: openbao
spec:
  parentRefs:
    # LAN only: the A record points at the gateway L2 IP (RFC1918, unroutable
    # publicly; keep the Cloudflare record DNS-only). TLS is terminated at the
    # gateway's openbao-https listener (cert-manager DNS-01, like argocd);
    # plaintext http is redirected to https by redirect.yaml.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: openbao-https
  hostnames:
    - bao.icaninto.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: openbao-active
          port: 8200
          weight: 1
