# Tailnet exposure: TLS terminates at the tailscale proxy; the backend is the
# operator's public Service (in-cluster HTTPS with the operator-generated CA —
# the CRD has no TLS-off option). The ts proxy has no CA-trust knob, so verify
# at cutover that it accepts the backend; if it rejects the operator CA, drop
# this Ingress — tailnet hosts reach bao.icaninto.space directly through
# subnet routing (the DNS record is DNS-only, RFC1918).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao
  namespace: openbao
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: openbao-public
      port:
        number: 8200
  tls:
    - hosts:
        - openbao
