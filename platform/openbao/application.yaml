# OpenBao cluster: lifecycle is owned by the kubebao operator
# (platform/openbao-operator) via the OpenBaoCluster CR in this folder.
# In-Bao configuration (auth, policies, roles, mounts, secret data) is
# Terraform: infra/openbao-config (Atlantis applies).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/infrabytes/homelab-kubernetes
      targetRevision: main
      path: platform/openbao
      directory:
        recurse: true
        exclude: "application*.yaml"
  destination:
    namespace: openbao
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
