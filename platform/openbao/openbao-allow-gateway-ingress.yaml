---
# The operator's NetworkPolicy cannot name the Cilium Gateway's envoy: it is
# host-network and carries the reserved `ingress` identity, which no
# namespaceSelector peer can match. Without this CNP, the Gateway → 8200 path
# (bao.icaninto.space) is dropped. Everything else is spec.network in
# openbaocluster.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-allow-gateway-ingress
  namespace: openbao
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
      app.kubernetes.io/instance: openbao
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
