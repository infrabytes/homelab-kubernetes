# Upstream git chart (no published Helm/OCI chart): `image.tag` and `targetRevision` must name the same release; Renovate bumps both.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-sandbox
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/kubernetes-sigs/agent-sandbox
      targetRevision: v1.0.8
      path: helm
      helm:
        releaseName: agent-sandbox
        values: |
          image:
            tag: v1.0.8
          # namespace.yaml in this folder owns the Namespace, so the chart must not render it.
          namespace:
            create: false
          controller:
            extensions: true
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 64Mi
          metrics:
            serviceMonitor:
              enabled: true
    - repoURL: https://github.com/infrabytes/homelab-kubernetes
      targetRevision: main
      path: platform/agent-sandbox
      directory:
        recurse: true
        exclude: "application*.yaml"
  destination:
    namespace: agent-sandbox-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
