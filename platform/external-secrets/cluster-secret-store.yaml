# OpenBao store: controller SA → k8s auth role `external-secrets` (read-only `eso-readonly` policy; setup: openbao README).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    openbao:
      server: http://openbao.openbao.svc:8200
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
