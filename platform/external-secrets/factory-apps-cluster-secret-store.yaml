# ClusterSecretStore for Factory-written app secrets (KV mount factory-apps).
# The factory-server pod authenticates to OpenBao per-session (role
# factory-app-writer, postStart-managed) and writes
# factory-apps/<namespace>/<secret-name>/<key>; ExternalSecret manifests in any
# namespace reference this store to materialize the K8s Secret. The reader SA
# holds read-only capability on the factory-apps mount only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-apps-eso
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-factory-apps
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: factory-apps
      version: v2
      auth:
        kubernetes:
          path: kubernetes
          role: eso-factory-apps
          serviceAccountRef:
            name: factory-apps-eso
            namespace: external-secrets
