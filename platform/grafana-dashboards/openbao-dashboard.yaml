apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: openbao-dashboard
  namespace: openbao
spec:
  instanceSelector:
    matchLabels:
      grafanaInstance: main
  allowCrossNamespaceImport: true
  folder: OpenBao
  resyncPeriod: 1h
  configMapRef:
    name: openbao-dashboard
    key: dashboard.json
  datasources:
    - inputName: DS_PROMXY
      datasourceName: grafanacloud-prom
