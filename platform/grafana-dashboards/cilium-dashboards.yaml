# Cilium chart dashboards: the ConfigMaps come from infra/cluster/cilium.tf
# (six of them, in kube-system); grafana-operator substitutes ${DS_PROMETHEUS}
# literally, so the mapping needs the managed Prometheus datasource uid.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-dashboard
  namespace: kube-system
spec:
  instanceSelector:
    matchLabels:
      grafanaInstance: main
  allowCrossNamespaceImport: true
  folder: Cilium
  resyncPeriod: 1h
  configMapRef:
    name: cilium-dashboard
    key: cilium-dashboard.json
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: grafanacloud-prom
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
