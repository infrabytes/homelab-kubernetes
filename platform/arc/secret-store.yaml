# Namespaced store: only this namespace's ExternalSecrets reach the runner PAT path (OpenBao policy eso-arc-runners).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-arc-runners
  namespace: arc-runners
spec:
  provider:
    openBao:
      server: https://openbao-public.openbao.svc:8200
      # The operator-generated in-cluster CA; the Secret is copied into this
      # namespace by the one-time runbook step (platform/openbao README).
      caProvider:
        type: Secret
        name: openbao-tls-ca
        key: ca.crt
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-arc-runners
          serviceAccountRef:
            name: arc-runners-eso
