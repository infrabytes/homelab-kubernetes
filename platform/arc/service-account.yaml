# No host RBAC: the preview diffs inside its own kind cluster (the breaking-change claim grant lives in platform/alert-triage).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner
  namespace: arc-runners
---
# ESO identity for the namespaced store (OpenBao role eso-arc-runners binds to it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runners-eso
  namespace: arc-runners
