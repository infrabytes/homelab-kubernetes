apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gha-runner-scale-set-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
    targetRevision: 0.15.0
    path: .
    helm:
      releaseName: gha-runner-scale-set-controller
      values: |
        # Sizing baseline 2026-08-27..09-10 (Grafana Cloud, 13d22h): memory request = p95
        # rounded up to 64Mi (32Mi floor), limit = max(1.5x request, 1.25x peak); CPU requests only.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 96Mi
        # Empty metrics flags leave the endpoints off; platform/arc/podmonitors.yaml scrapes the ports this enables.
        metrics:
          controllerManagerAddr: ":8080"
          listenerAddr: ":8080"
          listenerEndpoint: "/metrics"
  destination:
    namespace: arc-systems
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The chart's CRDs exceed the 256KB annotation limit of client-side apply,
    # so the CRDs must be applied with server-side apply (same as
    # the prometheus-operator-crds app).
    syncOptions:
      - ServerSideApply=true
