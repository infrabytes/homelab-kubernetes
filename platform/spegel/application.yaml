apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spegel-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/spegel-org/helm-charts/spegel
    targetRevision: 0.7.4
    path: .
    helm:
      releaseName: spegel
      values: |
        spegel:
          containerdRegistryConfigPath: /etc/cri/conf.d/hosts
        # Sizing baseline 2026-08-27..09-10 (Grafana Cloud, 13d22h): memory request = p95
        # rounded up to 64Mi (32Mi floor), limit = max(1.5x request, 1.25x peak); CPU requests only.
        # Overrides the chart default (128Mi request = limit).
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 96Mi
        serviceMonitor:
          enabled: true
  destination:
    namespace: spegel
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
