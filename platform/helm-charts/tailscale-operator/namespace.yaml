# Operator proxy pods (sysctler, tailscale) run privileged — Talos's default baseline PSA rejects them without this label.
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: tailscale
  labels:
    pod-security.kubernetes.io/enforce: privileged
