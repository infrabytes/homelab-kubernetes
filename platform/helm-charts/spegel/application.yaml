apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spegel-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/spegel-org/helm-charts/spegel
    targetRevision: 0.7.4
    path: .
    helm:
      releaseName: spegel
      values: |
        spegel:
          containerdRegistryConfigPath: /etc/cri/conf.d/hosts
        # 14d p95 usage (Grafana Cloud): CPU requests only, memory limit = 1.5x request.
        # Overrides the chart default (128Mi request = limit).
        resources:
          requests:
            cpu: 30m
            memory: 48Mi
          limits:
            memory: 72Mi
        serviceMonitor:
          enabled: true
  destination:
    namespace: spegel
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
