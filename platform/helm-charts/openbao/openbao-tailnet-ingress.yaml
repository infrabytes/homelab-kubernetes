# Tailnet exposure: operator-managed TLS + Serve (plain HTTP to the Service; TLS terminates at the proxy).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao
  namespace: openbao
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: openbao-active
      port:
        number: 8200
  tls:
    - hosts:
        - openbao
