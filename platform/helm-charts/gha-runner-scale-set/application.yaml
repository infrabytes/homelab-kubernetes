apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gha-runner-scale-set-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
    targetRevision: 0.14.2
    path: .
    helm:
      releaseName: gha-runner-scale-set
      values: |
        githubConfigUrl: "https://github.com/infrabytes/"
        githubConfigSecret: arc-runner-auth
        controllerServiceAccount:
          # Must match the controller chart's SA (named after its helm release name); a mismatch breaks runner registration secret reads.
          name: gha-runner-scale-set-controller-gha-rs-controller
          namespace: arc-systems
        runnerScaleSetName: homelab-runner
        runnerGroup: homelab
        # One runner always alive keeps pod-local caches warm; jobs stay fully concurrent.
        minRunners: 1
        template:
          spec:
            serviceAccountName: arc-runner
            automountServiceAccountToken: true
            volumes:
              - name: tool-cache-seed
                persistentVolumeClaim:
                  claimName: gha-runner-tool-cache
              - name: tool-cache-local
                # Capacity ceiling: the warm workflow keeps the seed a pure
                # function of the current pins (~1.7 GB hydrated), so 10 Gi
                # leaves ample headroom for future tool/env growth; a pod
                # exceeding it is evicted instead of eating node disk.
                emptyDir:
                  sizeLimit: 10Gi
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.337.0
                # Best-effort hydration from the seed tarballs (UID derived at runtime: image content changes across versions).
                command:
                  - /bin/sh
                  - -c
                  - |
                    for t in runner mise pre-commit; do
                      if [ -f /opt/tool-cache/seed/$t.tar.gz ]; then
                        sudo mkdir -p /opt/tool-cache/local/$t && sudo tar xzf /opt/tool-cache/seed/$t.tar.gz -C /opt/tool-cache/local/$t 2>/dev/null && sudo chown -R "$(id -u):$(id -g)" /opt/tool-cache/local/$t
                      fi
                    done
                    exec /home/runner/run.sh
                volumeMounts:
                  - name: tool-cache-seed
                    mountPath: /opt/tool-cache/seed
                  - name: tool-cache-local
                    mountPath: /opt/tool-cache/local
                env:
                  - name: RUNNER_TOOL_CACHE
                    value: /opt/tool-cache/local/runner
                  - name: MISE_DATA_DIR
                    value: /opt/tool-cache/local/mise
                  - name: PRE_COMMIT_HOME
                    value: /opt/tool-cache/local/pre-commit
                  - name: PATH
                    value: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  destination:
    namespace: arc-runners
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
