apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcluster-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.loft.sh
    chart: vcluster
    targetRevision: 0.37.0
    helm:
      releaseName: vcluster
      values: |
        telemetry:
          enabled: false
        # Sizing baseline 2026-08-27..09-10 (Grafana Cloud, 13d22h): memory request = p95
        # rounded up to 64Mi (32Mi floor), limit = max(1.5x request, 1.25x peak); CPU requests only.
        controlPlane:
          statefulSet:
            resources:
              requests:
                cpu: 200m
                memory: 1088Mi
                ephemeral-storage: 1Gi
              limits:
                memory: 1632Mi
                ephemeral-storage: 10Gi
        # Proxies the host metrics-server (read-only) - no metrics server is deployed in the vCluster.
        integrations:
          metricsServer:
            enabled: true
        # sync.fromHost.customResources is vCluster.Pro - OSS (chart 0.36.1) silently ignores it.
  destination:
    namespace: vcluster
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
