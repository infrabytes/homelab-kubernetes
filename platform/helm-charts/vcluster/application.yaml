apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vcluster-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.loft.sh
    chart: vcluster
    targetRevision: 0.36.1
    helm:
      releaseName: vcluster
      values: |
        telemetry:
          enabled: false
        # 14d p95 usage (Grafana Cloud): CPU requests only, memory limit = 1.5x request.
        controlPlane:
          statefulSet:
            resources:
              requests:
                cpu: 250m
                memory: 960Mi
                ephemeral-storage: 1Gi
              limits:
                memory: 1440Mi
                ephemeral-storage: 10Gi
        # Serve the metrics API inside the vCluster by proxying the host
        # metrics-server (read-only), so the preview VPA recommender and
        # any HPA can work.
        integrations:
          metricsServer:
            enabled: true
        # Note: generic sync.fromHost.customResources (e.g. exposing the
        # host Gateway API objects to the preview external-dns/cert-manager)
        # is a vCluster.Pro feature on chart 0.36.1 - the OSS vCluster
        # ignores it. Instead, pr-preview.py copies the required CRD
        # definitions from the host into the vCluster before deploying
        # apps that need them.
  destination:
    namespace: vcluster
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
