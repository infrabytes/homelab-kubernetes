apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gha-runner-scale-set-controller-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
    targetRevision: 0.14.2
    path: .
    helm:
      releaseName: gha-runner-scale-set-controller
      values: |
        # 14d p95 usage (Grafana Cloud): CPU requests only, memory limit = 1.5x request.
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 72Mi
  destination:
    namespace: arc-systems
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The chart's CRDs exceed the 256KB annotation limit of client-side apply,
    # so the CRDs must be applied with server-side apply (same as
    # prometheus-operator-crds-app).
    syncOptions:
      - ServerSideApply=true
