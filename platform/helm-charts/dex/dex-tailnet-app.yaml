# Second Dex for the tailnet (separate issuer — OpenBao requires discovery issuer to match URL). Config from dex-tailnet-config Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex-tailnet-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dexidp.github.io/helm-charts
    chart: dex
    targetRevision: 0.24.1
    helm:
      releaseName: dex
      values: |
        # fullnameOverride keeps the cluster-scoped RBAC (ClusterRole/dex-tailnet) distinct from the LAN release's ClusterRole/dex.
        fullnameOverride: dex-tailnet
        replicaCount: 1
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
        configSecret:
          create: false
          name: dex-tailnet-config
        # In-cluster HTTPS (Terraform-generated cert) for OpenBao's discovery fetch; tailnet TLS comes from the L7 Ingress.
        https:
          enabled: true
        volumeMounts:
          - name: tls
            mountPath: /etc/dex/tls
            readOnly: true
        volumes:
          - name: tls
            secret:
              secretName: dex-tailnet-tls
        service:
          clusterIP: 10.111.254.10
          ports:
            https:
              port: 443
        # 14d p95 usage (Grafana Cloud): CPU requests only, memory limit = 1.5x request.
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 144Mi
        serviceMonitor:
          enabled: true
  destination:
    namespace: dex-tailnet
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
