# Second Dex for the tailnet (separate issuer — OpenBao requires discovery issuer to match URL). Config from dex-tailnet-config Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex-tailnet-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dexidp.github.io/helm-charts
    chart: dex
    targetRevision: 0.24.1
    helm:
      releaseName: dex
      values: |
        replicaCount: 1
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
        configSecret:
          create: false
          name: dex-tailnet-config
        service:
          annotations:
            tailscale.com/expose: "true"
            tailscale.com/hostname: "dex"
          clusterIP: <DEX_TAILNET_CLUSTER_IP>
        # 14d p95 usage (Grafana Cloud): CPU requests only, memory limit = 1.5x request.
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 144Mi
        serviceMonitor:
          enabled: true
  destination:
    namespace: dex-tailnet
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
