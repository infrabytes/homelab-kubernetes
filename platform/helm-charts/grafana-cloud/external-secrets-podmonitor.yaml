# ESO's controller_runtime_*/workqueue_depth bypass the serviceMonitors allowlist; the dashboard reads a service label.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: external-secrets
  namespace: grafana-cloud
spec:
  namespaceSelector:
    matchNames:
      - external-secrets
  selector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
      relabelings:
        - targetLabel: service
          replacement: external-secrets
