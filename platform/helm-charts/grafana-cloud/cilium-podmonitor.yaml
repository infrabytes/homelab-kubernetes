# Cilium agent/Hubble/operator metrics; podTargetLabels mirror the chart's own
# ServiceMonitors because the chart dashboards filter on k8s_app/io_cilium_app.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-agent
  namespace: grafana-cloud
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      k8s-app: cilium
  podTargetLabels:
    - k8s-app
  podMetricsEndpoints:
    - port: prometheus
      interval: 60s
    - port: hubble-metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cilium-operator
  namespace: grafana-cloud
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      io.cilium/app: operator
  podTargetLabels:
    - io.cilium/app
  podMetricsEndpoints:
    - port: prometheus
      interval: 60s
