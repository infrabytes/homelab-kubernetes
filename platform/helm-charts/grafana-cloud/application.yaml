apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-cloud-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 4.5.2
    helm:
      releaseName: k8s-monitoring
      values: |
        cluster:
          name: talos-cluster

        destinations:
          prometheus:
            type: prometheus
            url: http://vmsingle-victoria-metrics-single-server.observability.svc.cluster.local:8428/api/v1/write
            auth:
              type: none
          loki:
            type: loki
            url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
            auth:
              type: none

        clusterMetrics:
          enabled: true
          collector: alloy-metrics
          kube-state-metrics:
            metricsTuning:
              # NetworkPolicy objects (~100 series): the default allowlist omits them.
              includeMetrics:
                - kube_networkpolicy_.*
        hostMetrics:
          enabled: true
          collector: alloy-metrics
        podLogsViaLoki:
          enabled: true
          collector: alloy-logs
        clusterEvents:
          enabled: true
          collector: alloy-logs

        integrations:
          collector: alloy-metrics
          cert-manager:
            instances:
              - name: cert-manager
                labelSelectors:
                  app.kubernetes.io/instance: cert-manager
          alloy:
            instances:
              - name: alloy
                labelSelectors:
                  app.kubernetes.io/name: alloy

        prometheusOperatorObjects:
          enabled: true
          collector: alloy-metrics

        # Sizing baseline 2026-08-27..09-10 (Grafana Cloud, 13d22h): memory request = p95
        # rounded up to 64Mi (32Mi floor), limit = max(1.5x request, 1.25x peak); CPU requests only.
        telemetryServices:
          kube-state-metrics:
            deploy: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 96Mi
          node-exporter:
            deploy: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 48Mi

        collectors:
          alloy-metrics:
            presets: [clustered, statefulset]
            alloy:
              resources:
                requests:
                  cpu: 40m
                  memory: 448Mi
                limits:
                  memory: 672Mi
            configReloader:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 48Mi
          alloy-logs:
            presets: [daemonset, filesystem-log-reader]
            # Collector level, not under alloy.: nested there it lands in the
            # unused Alloy CR and the Talos syslog listener silently never runs.
            extraConfig: |
              loki.source.syslog "talos" {
                listener {
                  address            = "0.0.0.0:5140"
                  protocol           = "tcp"
                  syslog_format      = "raw"
                  max_message_length = 65536
                }
                forward_to = [loki.process.talos.receiver]
              }

              loki.process "talos" {
                stage.parse_json {
                  expressions = {
                    talos_time    = "talos-time",
                    talos_level   = "talos-level",
                    talos_service = "talos-service",
                    talos_node    = "node",
                    msg           = "msg",
                  }
                }

                stage.template {
                  source = "line"
                  format = "{{ .msg }}"
                }

                stage.timestamp {
                  source = "talos_time"
                  format = "RFC3339Nano"
                }

                stage.labels {
                  values = {
                    talos_level   = "",
                    talos_service = "",
                    node          = "",
                  }
                }

                forward_to = [loki.write.loki.receiver]
              }
            alloy:
              resources:
                requests:
                  cpu: 70m
                  memory: 384Mi
                limits:
                  memory: 576Mi
              stabilityLevel: experimental
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
            configReloader:
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 96Mi
  destination:
    namespace: grafana-cloud
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
