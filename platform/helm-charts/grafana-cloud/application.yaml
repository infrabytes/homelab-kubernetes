apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-cloud-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: k8s-monitoring
    targetRevision: 4.5.2
    helm:
      releaseName: k8s-monitoring
      values: |
        cluster:
          name: talos-cluster

        destinations:
          prometheus:
            type: prometheus
            url: https://prometheus-prod-65-prod-eu-west-2.grafana.net/api/prom/push
            auth:
              type: basic
              usernameKey: prometheus-username
              passwordKey: prometheus-token
            secret:
              create: false
              name: alloy-secrets
              namespace: grafana-cloud
          loki:
            type: loki
            url: https://logs-prod-012.grafana.net/loki/api/v1/push
            auth:
              type: basic
              usernameKey: loki-username
              passwordKey: loki-token
            secret:
              create: false
              name: alloy-secrets
              namespace: grafana-cloud

        clusterMetrics:
          enabled: true
          collector: alloy-metrics
          # Free tier budget: 10K active series; excludes are dated live reference checks (2026-09-12 ~2.6K, 2026-09-15 ~1.3K).
          kube-state-metrics:
            metricsTuning:
              # NetworkPolicy objects (~100 series): the default allowlist omits them.
              includeMetrics:
                - kube_networkpolicy_.*
              excludeMetrics:
                - kube_pod_status_reason
                - kube_pod_status_phase
                - kube_replicaset_.*
                - kube_pod_owner
                - kube_pod_restart_policy                          # 102
                - kube_pod_start_time                              # 102
                - kube_secret_metadata_resource_version            # 76
                - kube_configmap_metadata_resource_version         # 72
                - kube_persistentvolume_status_phase               # 60
                - kube_namespace_status_phase                      # 54
                - kube_pod_init_container_.*                       # ~318
                # workload _metadata_generation stays: a workload dashboard counts it
                - kube_deployment_spec_.*
                - kube_deployment_status_.*                        # ~152, subsumes the 09-12 status_condition entry
                - kube_daemonset_(created|deletion_timestamp|status_).*  # ~73
                - kube_statefulset_(created|replicas|persistentvolumeclaim_retention_policy|status_).*  # ~88
                - kube_persistentvolumeclaim_.*                    # 72
                - kube_node_(created|labels|role|spec_pod_cidrs|spec_unschedulable|status_addresses|status_capacity)  # ~49
          kubelet:
            metricsTuning:
              excludeMetrics:
                - kubelet_pod_start_duration_seconds_bucket
                - storage_operation_duration_seconds.*   # ~86, unreferenced
                - kubelet_pleg_relist_.*                 # ~100, unreferenced
          cadvisor:
            metricsTuning:
              excludeMetrics:
                - container_memory_usage_bytes
                - container_fs_writes_total
                - container_fs_writes_bytes_total
                - container_fs_reads_bytes_total
                - container_fs_reads_total
                - container_network_receive_packets_total
                - container_network_transmit_packets_total
                - container_network_receive_packets_dropped_total
                - container_network_transmit_packets_dropped_total
        hostMetrics:
          enabled: true
          collector: alloy-metrics
        podLogsViaLoki:
          enabled: true
          collector: alloy-logs
        clusterEvents:
          enabled: true
          collector: alloy-logs

        integrations:
          collector: alloy-metrics
          cert-manager:
            instances:
              - name: cert-manager
                labelSelectors:
                  app.kubernetes.io/instance: cert-manager
                metrics:
                  tuning:
                    # ~500 series of Go/process runtime internals
                    excludeMetrics:
                      - "go_.*"
                      - "process_.*"
          alloy:
            instances:
              - name: alloy
                labelSelectors:
                  app.kubernetes.io/name: alloy

        prometheusOperatorObjects:
          enabled: true
          collector: alloy-metrics
          # ESO families its dashboard reads (cilium metrics come from the
          # Cilium chart's own ServiceMonitors, see infra/cluster/cilium.tf).
          podMonitors:
            metricsTuning:
              includeMetrics:
                - controller_runtime_(active_workers|max_concurrent_reconciles|reconcile_total|reconcile_time_seconds_.*|webhook_latency_seconds_.*|webhook_requests_in_flight|webhook_requests_total)
                - workqueue_depth
          # Series budget (10K free-tier cap): drop runtime/library internals
          # measured live (Aug 2026) at 16,459 total before this block.
          # Add new families here as components grow.
          serviceMonitors:
            metricsTuning:
              excludeMetrics:
                - "grpc_server_.*"
                - "go_.*"
                - "process_.*"
                - "libp2p_.*"
                - "longhorn_rest_client_.*"
                - "longhorn_workqueue_.*"
                # agent-sandbox v1.0.2 exposes 269 workqueue_/rest_client_ series (9038/10K, 2026-09-11).
                - "rest_client_.*"
                - "workqueue_.*"
                - "http_.*"
                - "argocd_kubectl_(request_duration_seconds|rate_limiter_duration_seconds|response_size_bytes|request_size_bytes|requests_total).*"
                - "controller_runtime_.*"
                # 2026-09-15 re-triage: zero live references, incl. chart-shipped dashboards
                - longhorn_.*                           # ~471, subsumes the 09-11 replica_state entry
                - spegel_.*                             # ~135
                - vault_.*                              # ~790, OpenBao per-endpoint/route internals
                - hubble_metrics_http_handler_.*        # 60, :9965 self-metrics

        # Sizing baseline 2026-08-27..09-10 (Grafana Cloud, 13d22h): memory request = p95
        # rounded up to 64Mi (32Mi floor), limit = max(1.5x request, 1.25x peak); CPU requests only.
        telemetryServices:
          kube-state-metrics:
            deploy: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 96Mi
          node-exporter:
            deploy: true
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 48Mi

        collectors:
          alloy-metrics:
            presets: [clustered, statefulset]
            alloy:
              resources:
                requests:
                  cpu: 40m
                  memory: 448Mi
                limits:
                  memory: 672Mi
            configReloader:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 48Mi
          alloy-logs:
            presets: [daemonset, filesystem-log-reader]
            alloy:
              resources:
                requests:
                  cpu: 70m
                  memory: 384Mi
                limits:
                  memory: 576Mi
              stabilityLevel: experimental
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
              extraConfig: |
                loki.source.syslog "talos" {
                  listener {
                    address            = "0.0.0.0:5140"
                    protocol           = "tcp"
                    syslog_format      = "raw"
                    max_message_length = 65536
                  }
                  forward_to = [loki.process.talos.receiver]
                }

                loki.process "talos" {
                  stage.parse_json {
                    expressions = {
                      talos_time    = "talos-time",
                      talos_level   = "talos-level",
                      talos_service = "talos-service",
                      talos_node    = "node",
                      msg           = "msg",
                    }
                  }

                  stage.template {
                    source = "line"
                    format = "{{ .msg }}"
                  }

                  stage.timestamp {
                    source = "talos_time"
                    format = "RFC3339Nano"
                  }

                  stage.labels {
                    values = {
                      talos_level   = "",
                      talos_service = "",
                      node          = "",
                    }
                  }

                  forward_to = [loki.write.loki.receiver]
                }
            configReloader:
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 96Mi
  destination:
    namespace: grafana-cloud
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
