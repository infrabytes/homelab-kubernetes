# Controller SA pinned to `external-secrets` (chart default `external-secrets-external-secrets`): stable identity; consumer stores authenticate as their own SAs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      releaseName: external-secrets
      values: |
        serviceAccount:
          name: external-secrets
        # Store CRDs exceed the 256KB last-applied annotation limit — per-resource Replace syncs them via create/PUT instead.
        crds:
          annotations:
            argocd.argoproj.io/sync-options: Replace=true
        serviceMonitor:
          enabled: true
        grafanaDashboard:
          enabled: true
        # Sizing baseline 2026-08-27..09-10 (Grafana Cloud, 13d22h): memory request = p95
        # rounded up to 64Mi (32Mi floor), limit = max(1.5x request, 1.25x peak); CPU requests only.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 96Mi
        # Egress: cluster DNS + OpenBao 8200 (audited); the API-server edge is the CNP, since plain NP cannot name that entity.
        networkPolicy:
          enabled: true
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
              ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: openbao
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: openbao
              ports:
                - port: 8200
                  protocol: TCP
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 96Mi
          networkPolicy:
            enabled: true
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                ports:
                  - port: 53
                    protocol: UDP
                  - port: 53
                    protocol: TCP
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 96Mi
          networkPolicy:
            enabled: true
            egress:
              - to:
                  - namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: kube-system
                ports:
                  - port: 53
                    protocol: UDP
                  - port: 53
                    protocol: TCP
  destination:
    namespace: external-secrets
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
