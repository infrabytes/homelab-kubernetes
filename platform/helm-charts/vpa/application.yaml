apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes/autoscaler
    targetRevision: vertical-pod-autoscaler-1.7.1
    path: vertical-pod-autoscaler/charts/vertical-pod-autoscaler
    helm:
      releaseName: vertical-pod-autoscaler
      values: |
        updater:
          enabled: false
        admissionController:
          enabled: false
        recommender:
          replicas: 1
          image:
            tag: "1.7.1"
          resources:
            # 14d p95 usage (Grafana Cloud): CPU requests only, memory limit = 1.5x request.
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 72Mi
          podDisruptionBudget:
            enabled: false
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
  destination:
    namespace: kube-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
