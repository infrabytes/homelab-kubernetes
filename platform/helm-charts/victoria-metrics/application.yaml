apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-metrics-single
    targetRevision: 0.46.0
    helm:
      releaseName: vmsingle
      values: |
        server:
          retentionPeriod: 90d
          persistentVolume:
            storageClassName: nfs-nas
            size: 30Gi
          extraArgs:
            # A full NAS must go read-only instead of failing writes.
            storage.minFreeDiskSpaceBytes: 5GB
          serviceMonitor:
            enabled: true
          # New component (2026-09-16): initial estimate; re-measure after two weeks.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
