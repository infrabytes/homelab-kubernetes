# LAN only: the A record points at the gateway L2 IP (RFC1918, unroutable
# publicly); TLS terminates at the gateway's hubble-https listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: hubble-https
  hostnames:
    - hubble.icaninto.space
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
