# Tailnet exposure next to the LAN-only Gateway route (httproute.yaml): the UI has no authentication, so neither path is public.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hubble-ui
      port:
        number: 80
  tls:
    - hosts:
        - hubble-ui
