# Standalone Dex OIDC provider (OpenBao SSO, LAN-only); config from the Terraform-created dex-config Secret, exposure via route.yaml in this directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: dex-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dexidp.github.io/helm-charts
    chart: dex
    targetRevision: 0.25.2
    helm:
      releaseName: dex
      values: |
        replicaCount: 1
        # v2.45.1 names the image user (`dex`), so kubelet needs the numeric uid pinned to verify runAsNonRoot.
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1001
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
        configSecret:
          create: false
          name: dex-config
        # 14d p95 usage (Grafana Cloud): CPU requests only, memory limit = 1.5x request.
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 144Mi
        serviceMonitor:
          enabled: true
        # Egress: cluster DNS + GitHub over 443; storage is in-memory, so no API-server edge.
        networkPolicy:
          enabled: true
          egressRules:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
              ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
            - ports:
                - port: 443
                  protocol: TCP
  destination:
    namespace: dex
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
