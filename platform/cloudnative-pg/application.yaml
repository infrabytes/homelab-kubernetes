# CloudNativePG operator (https://cloudnative-pg.io). Operator only; no
# Cluster (database) resources yet. The chart's CRDs render as regular
# manifests (templates/crds/crds.yaml); the Cluster (653KB) and OperatorConfig
# (464KB) CRDs exceed the 256KB annotation limit of client-side apply, so the
# app must sync with server-side apply (same as the prometheus-operator-crds app).
# The operator self-generates its webhook certificates (cnpg-webhook-cert
# secret); no cert-manager involvement. It runs non-root with seccomp and
# dropped capabilities, so cnpg-system needs no privileged PSA label.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.2
      helm:
        releaseName: cloudnative-pg
        values: |
          # 14d (2026-11-14..2026-11-28): mem p95 80.9Mi, peak 95.7Mi -> 128Mi/192Mi; request = p95
          # rounded up to 64Mi (32Mi floor), limit = max(1.5x request, 1.25x peak); CPU requests only.
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 192Mi
          monitoring:
            podMonitorEnabled: true
            grafanaDashboard:
              create: true
    - repoURL: https://github.com/infrabytes/homelab-kubernetes
      targetRevision: main
      path: platform/cloudnative-pg
      directory:
        recurse: true
        exclude: "application*.yaml"
  destination:
    namespace: cnpg-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
