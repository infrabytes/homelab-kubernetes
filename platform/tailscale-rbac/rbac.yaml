# Tailscale API server proxy auth → cluster-admin. Replace <OWNER_TAILNET_EMAIL> with the actual email.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailscale-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: User
    name: <OWNER_TAILNET_EMAIL>
