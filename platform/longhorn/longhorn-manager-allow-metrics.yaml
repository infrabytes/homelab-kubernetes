---
# Supplemental NetworkPolicy: allow the Alloy metrics scrape of longhorn-manager.
#
# Longhorn's chart ships internal default-deny network policies
# (`networkPolicies.restrictInternalTraffic`, default true) that only allow
# same-namespace traffic to longhorn-manager. The chart hardcodes that ingress
# allow-list with no value to extend it, and this cluster's monitoring scrapes
# from the grafana-cloud namespace (longhorn's ServiceMonitor targets the
# manager port, 9500). k8s NetworkPolicies union, so this narrow allow
# supplements the chart's policies instead of replacing them. If you'd rather
# not hold this here, the chart-side alternative is
# `networkPolicies.restrictInternalTraffic: false` (drops the protection).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-metrics
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: grafana-cloud
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-metrics
      ports:
        - port: 9500
          protocol: TCP
