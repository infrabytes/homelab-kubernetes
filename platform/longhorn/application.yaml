apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.13.0
      helm:
        releaseName: longhorn
        values: |
          preUpgradeChecker:
            jobEnabled: false
          longhornUI:
            replicas: 1
          csi:
            # 2 replicas each: with 1, the attacher/provisioner PDBs (minAvailable 1)
            # allow zero disruptions forever, so node drains hang on those pods.
            attacherReplicaCount: 2
            provisionerReplicaCount: 2
            resizerReplicaCount: 2
            snapshotterReplicaCount: 2
          defaultSettings:
            defaultDataPath: /var/mnt/longhorn
            # Only applies at disk creation; the three existing disks carry their own spec.disks[].storageReserved.
            storageReservedPercentageForDefaultDisk: "10"
            # Nodes are rebooted, not removed, during upgrades, and the provider's
            # drain budget is a fixed 5 minutes (`nodedrain.DefaultDrainTimeout`, not
            # configurable from the resource), so nothing may gate an eviction on
            # replica migration: block-if-contains-last-replica held the
            # instance-manager PDB for 27 minutes, and allow-if-replica-is-stopped
            # still wedged the 2026-10-30 v1.14.4->v1.14.5 apply past the budget on two
            # workers. always-allow lets the eviction through; the replica data stays
            # on the rebooted node's disk and Longhorn rebuilds from it, so a volume
            # can stay degraded until that rebuild finishes.
            nodeDrainPolicy: always-allow
            createDefaultDiskLabeledNodes: true
            storageMinimalAvailablePercentage: "10"
            # Replicas are only placed at creation/rebuild time; best-effort lets Longhorn correct the 2026-09-13 skew itself.
            replicaAutoBalance: best-effort
            # Sizing baseline 2026-08-27..09-10 (Grafana Cloud, 13d22h): the chart applies this to
            # the runtime-created csi-plugin DaemonSet containers (longhorn-csi-plugin,
            # node-driver-registrar, longhorn-liveness-probe).
            systemManagedCSIComponentsResourceLimits: '{"longhorn-csi-plugin": {"requests": {"cpu": "10m", "memory": "64Mi"}, "limits": {"memory": "96Mi"}}, "node-driver-registrar": {"requests": {"cpu": "10m", "memory": "32Mi"}, "limits": {"memory": "48Mi"}}, "longhorn-liveness-probe": {"requests": {"cpu": "10m", "memory": "32Mi"}, "limits": {"memory": "48Mi"}}}'
          longhornManager:
            # Sizing baseline 2026-08-27..09-10 (Grafana Cloud, 13d22h): memory request = p95
            # rounded up to 64Mi (32Mi floor), limit = max(1.5x request, 1.25x peak); CPU requests only.
            resources:
              requests:
                cpu: 40m
                memory: 256Mi
              limits:
                memory: 384Mi
          longhornGlobalManager:
            # New component (2026-10-04): initial estimate; re-measure after two weeks.
            # Memory follows the cluster-wide Pod informer cache, not the node count.
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
          persistence:
            defaultClass: true
            defaultClassReplicaCount: 2
          metrics:
            serviceMonitor:
              enabled: true
          httproute:
            enabled: true
            parentRefs:
              - name: homelab
                namespace: gateway
                sectionName: longhorn-https
            hostnames:
              - longhorn.icaninto.space
            # The UI has no authentication of its own: every request passes the authentik outpost
            # first (authentik-outpost-longhorn in platform/authentik serves /outpost.goauthentik.io).
            filters:
              - type: ExternalAuth
                externalAuth:
                  protocol: HTTP
                  backendRef:
                    group: ""
                    kind: Service
                    name: authentik-server
                    namespace: authentik
                    # The Service port, not the container port (80 -> 9000).
                    port: 80
                  http:
                    path: /outpost.goauthentik.io/auth/envoy
                    allowedHeaders:
                      - cookie
                      - user-agent
                      - x-forwarded-for
                      - x-forwarded-host
                      - x-forwarded-proto
    - repoURL: https://github.com/infrabytes/homelab-kubernetes
      targetRevision: main
      path: platform/longhorn
      directory:
        recurse: true
        exclude: "application*.yaml"
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
