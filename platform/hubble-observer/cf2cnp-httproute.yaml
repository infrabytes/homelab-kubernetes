# The chart's own httpRoute has no filters value, so the route lives here: cf2cnp generates policies
# from live flows and has no authentication, so every request passes the authentik outpost first
# (authentik-outpost-cf2cnp in platform/authentik serves /outpost.goauthentik.io on this host).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cf2cnp
  namespace: hubble-observer
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: cf2cnp-https
  hostnames:
    - cf2cnp.icaninto.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              group: ""
              kind: Service
              name: authentik-server
              namespace: authentik
              # The Service port, not the container port (80 -> 9000).
              port: 80
            http:
              path: /outpost.goauthentik.io/auth/envoy
              # Cookie carries the outpost session; the Host header is always sent.
              allowedHeaders:
                - cookie
                - user-agent
                - x-forwarded-for
                - x-forwarded-host
                - x-forwarded-proto
      # cf2cnp's Service (chart fullname, port 80 -> container 8080).
      backendRefs:
        - group: ""
          kind: Service
          name: hubble-observer-cf2cnp
          port: 80
          weight: 1
