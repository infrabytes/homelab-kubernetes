# The view-only ClusterRole/ClusterRoleBinding handed to the viewer kubeconfig (see infra/viewer-kubeconfig).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-viewer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/infrabytes/homelab-kubernetes
    targetRevision: main
    path: platform/cluster-viewer
    directory:
      recurse: true
      exclude: "application*.yaml"
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
  # The aggregation controller fills cluster-viewer's rules, so the live role never matches its empty manifest.
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-viewer
      jqPathExpressions:
        - .rules
