# Namespaced store: only this namespace's ExternalSecrets reach the backup-credential path (OpenBao policy eso-velero).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-velero
  namespace: velero
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-velero
          serviceAccountRef:
            name: velero-eso
