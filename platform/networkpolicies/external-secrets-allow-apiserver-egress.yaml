---
# Plain NetworkPolicy cannot name the API-server entity, so the audited kube-apiserver edge (443 Service, 6443 endpoint) is a Cilium policy covering every ESO component.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-allow-apiserver-egress
  namespace: external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
