---
# The chart's CNP grants no DNS egress; the observer resolves the relay by name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hubble-observer-allow-dns-egress
  namespace: hubble-observer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hubble-observer
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
