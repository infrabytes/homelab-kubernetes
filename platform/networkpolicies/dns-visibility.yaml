# hubble_dns_* only exists when a DNS rule sits under toPorts[].rules.dns (toFQDNs alone does not).
# enableDefaultDeny: false keeps this visibility-only policy from turning egress into an allow-list.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: dns-visibility
spec:
  description: Route pod DNS through Cilium's proxy so hubble_dns_* metrics exist.
  enableDefaultDeny:
    egress: false
    ingress: false
  endpointSelector:
    matchLabels: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: '*'
