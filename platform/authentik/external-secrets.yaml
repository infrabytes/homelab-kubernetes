# Seeded in OpenBao at secret/authentik; ESO's OpenBao provider is read-only, so there is no PushSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-authentik
    kind: SecretStore
  target:
    name: authentik-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTHENTIK_SECRET_KEY: "{{ .secret_key }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .bootstrap_password }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .bootstrap_token }}"
        AUTHENTIK_BOOTSTRAP_EMAIL: "{{ .bootstrap_email }}"
        AUTHENTIK_EMAIL__PASSWORD: "{{ .smtp_password }}"
        BLUEPRINT_EMAIL_BBAYRAKT: "{{ .bbayrakt_email }}"
        BLUEPRINT_EMAIL_DHAUSTEIN: "{{ .dhaustein_email }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: authentik
        property: secret_key
    - secretKey: bootstrap_password
      remoteRef:
        key: authentik
        property: bootstrap_password
    - secretKey: bootstrap_token
      remoteRef:
        key: authentik
        property: bootstrap_token
    - secretKey: bootstrap_email
      remoteRef:
        key: authentik
        property: bootstrap_email
    - secretKey: smtp_password
      remoteRef:
        key: authentik
        property: smtp_password
    - secretKey: bbayrakt_email
      remoteRef:
        key: authentik
        property: bbayrakt_email
    - secretKey: dhaustein_email
      remoteRef:
        key: authentik
        property: dhaustein_email
---
# Barman object-store credentials for the authentik-pg cluster (postgres.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-backup-s3
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-authentik
    kind: SecretStore
  target:
    name: authentik-pg-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: authentik
        property: s3_access_key
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: authentik
        property: s3_secret_key
