---
# Supplemental NetworkPolicy: allow the Alloy metrics scrape (chart ServiceMonitors target 9300).
# The chart ships no network policies, so this is the only metrics allow beside the gateway one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: authentik-allow-metrics
  namespace: authentik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: k8s-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-metrics
      ports:
        - port: 9300
          protocol: TCP
