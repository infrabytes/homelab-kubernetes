# Namespaced store: only this namespace's ExternalSecrets reach the authentik secret path (OpenBao policy eso-authentik).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-authentik
  namespace: authentik
spec:
  provider:
    openBao:
      server: https://openbao-public.openbao.svc:8200
      # The operator-generated in-cluster CA; the Secret is copied into this
      # namespace by the one-time runbook step (platform/openbao README).
      caProvider:
        type: Secret
        name: openbao-tls-ca
        key: ca.crt
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-authentik
          serviceAccountRef:
            name: authentik-eso
