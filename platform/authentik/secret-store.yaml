# Namespaced store: only this namespace's ExternalSecrets reach the authentik secret path (OpenBao policy eso-authentik).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-authentik
  namespace: authentik
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-authentik
          serviceAccountRef:
            name: authentik-eso
