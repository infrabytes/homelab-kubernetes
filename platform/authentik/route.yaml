apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    # LAN-address issuer for LAN and tailnet alike: the DNS-only Cloudflare record points at the
    # gateway VIP, which the lan-subnet-router Connector advertises to tailnet devices.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: authentik-https
  hostnames:
    - authentik.icaninto.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          # Service port 80 -> container 9000 (TLS terminates at the gateway).
          port: 80
          weight: 1
