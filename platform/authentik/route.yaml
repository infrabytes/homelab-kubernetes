apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
  annotations:
    # Current prefix: external-dns v0.22+ ignores the legacy external-dns.alpha.kubernetes.io key, so this one is what opts the route out. The record is hand-made (SWAG target), so policy=sync must stop republishing the RFC1918 VIP.
    external-dns.kubernetes.io/controller: "manual-dns"
spec:
  parentRefs:
    # One issuer for LAN, tailnet and internet: SWAG forwards the public leg here with Host and SNI, LAN clients dial the VIP directly.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: authentik-https
  hostnames:
    - authentik.icaninto.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: authentik-server
          # Service port 80 -> container 9000 (TLS terminates at the gateway).
          port: 80
          weight: 1
