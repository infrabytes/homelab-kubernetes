# Local-account identity provider: Blueprints in blueprints/, secrets via ESO from OpenBao, Postgres in postgres.yaml.
# AUTHENTIK_* settings go through global.env: with existingSecret set the chart skips its own Secret, so authentik.* values are ignored.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: oci://ghcr.io/goauthentik/helm-charts/authentik
      targetRevision: 2026.8.5
      path: .
      helm:
        releaseName: authentik
        values: |
          global:
            # Rolls the pods when authentik-secret (ESO) or the blueprint ConfigMap changes.
            podAnnotations:
              reloader.stakater.com/auto: "true"
            # Image user is uid 1000 (numeric), which kubelet needs to verify runAsNonRoot.
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            env:
              # CNPG owns the app-user password; no copy in OpenBao.
              - name: AUTHENTIK_POSTGRESQL__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: authentik-pg-app
                    key: password
              - name: AUTHENTIK_POSTGRESQL__HOST
                value: authentik-pg-rw.authentik.svc.cluster.local
              - name: AUTHENTIK_POSTGRESQL__NAME
                value: authentik
              - name: AUTHENTIK_POSTGRESQL__USER
                value: authentik
              # The relay endpoint and sending address are not in this repo; only the STARTTLS flag is.
              - name: AUTHENTIK_EMAIL__USE_TLS
                value: "true"
              - name: AUTHENTIK_ERROR_REPORTING__ENABLED
                value: "false"
          authentik:
            # AUTHENTIK_SECRET_KEY, AUTHENTIK_WEB__BASE_URL and AUTHENTIK_BOOTSTRAP_* (akadmin break-glass) live here.
            existingSecret:
              secretName: authentik-secret
          postgresql:
            enabled: false
          blueprints:
            configMaps:
              - authentik-blueprints
          serviceAccount:
            # Only managed outposts need this ServiceAccount and its remote-cluster ClusterRole; the
            # forward-auth proxy providers in blueprints/ are served by the embedded outpost in-process.
            create: false
          server:
            replicas: 2
            pdb:
              enabled: true
              minAvailable: 1
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              runAsNonRoot: true
            # 2026-10-25..2026-10-28 (3d20h, VictoriaMetrics; the forward-auth gate went live 2026-10-28):
            # mem p95 732Mi, peak 732Mi -> request 768Mi; limit = max(1.5x request, 1.25x peak) = 1152Mi.
            # CPU: steady-state p95 40m over the gated 2h; 50m keeps the per-restart Django startup burst
            # (p95 287m while it runs) inside the request without limiting anything.
            resources:
              requests:
                cpu: 50m
                memory: 768Mi
              limits:
                memory: 1152Mi
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
          worker:
            replicas: 1
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              runAsNonRoot: true
            # 2026-10-25..2026-10-28 (3d20h, VictoriaMetrics), longest-lived replica: cpu p95 100m (avg 96m,
            # max 129m) -> 100m; mem p95 372Mi -> request 384Mi, peak 391Mi -> limit 576Mi.
            # Re-measure after the next two weeks of task history (2026-11-11).
            resources:
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                memory: 576Mi
            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
    - repoURL: https://github.com/infrabytes/homelab-kubernetes
      targetRevision: main
      path: platform/authentik
      directory:
        recurse: true
        exclude: "application*.yaml"
  destination:
    namespace: authentik
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
