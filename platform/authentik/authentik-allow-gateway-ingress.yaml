---
# The Cilium Gateway's envoy is host-network and carries the reserved `ingress` identity, which
# namespace/pod selectors cannot match; without this, Gateway -> 9000 (authentik.icaninto.space) is dropped.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-allow-gateway-ingress
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
