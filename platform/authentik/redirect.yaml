apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-http-redirect
  namespace: authentik
  annotations:
    # Same opt-out as route.yaml on the prefix v0.22+ reads (the legacy one is ignored): external-dns unions hostnames across routes, so an unannotated route still publishes this hostname.
    external-dns.kubernetes.io/controller: "manual-dns"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: http
  hostnames:
    - authentik.icaninto.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
