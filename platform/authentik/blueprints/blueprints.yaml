# Blueprints mounted into the worker by the chart; deleting a file here does not delete the objects it made.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  users.yaml: |-
    version: 1
    metadata:
      name: Homelab users
    entries:
      # The group below comes from the shipped bootstrap blueprint, so that one has to apply first.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: authentik Bootstrap
          required: true
      # Local accounts only; usernames match the GitHub logins the cluster RBAC already names. No passwords (recovery flow).
      # Emails come from OpenBao via !Env (ESO fills BLUEPRINT_EMAIL_*) so personal addresses stay out of this repo.
      - model: authentik_core.user
        identifiers:
          username: bbayrakt
        attrs:
          name: bbayrakt
          email: !Env BLUEPRINT_EMAIL_BBAYRAKT
          is_active: true
          groups:
            - !Find [authentik_core.group, [name, authentik Admins]]
      - model: authentik_core.user
        identifiers:
          username: dhaustein
        attrs:
          name: dhaustein
          email: !Env BLUEPRINT_EMAIL_DHAUSTEIN
          is_active: true
  mfa.yaml: |-
    version: 1
    metadata:
      name: Require TOTP
    entries:
      # Both identifiers come from shipped blueprints; blueprint order across files is undefined.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Authentication flow
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - TOTP MFA setup flow
          required: true
      # Enforce TOTP: no enrolled device -> inject the shipped TOTP setup stage instead of skipping.
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        identifiers:
          name: default-authentication-mfa-validation
        attrs:
          device_classes:
            - totp
          not_configured_action: configure
          configuration_stages:
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
  recovery.yaml: |-
    version: 1
    metadata:
      name: Password reset
    entries:
      # The identification stage edited at the end belongs to the shipped default flow.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Authentication flow
          required: true
      - model: authentik_flows.flow
        id: recovery-flow
        identifiers:
          slug: default-recovery-flow
        attrs:
          name: Default recovery flow
          title: Reset your password
          designation: recovery
          authentication: require_unauthenticated
      - model: authentik_stages_identification.identificationstage
        id: recovery-identification
        identifiers:
          name: default-recovery-identification
        attrs:
          user_fields:
            - email
            - username
      # use_global_settings reads AUTHENTIK_EMAIL__* (the relay values from OpenBao) from the pod env.
      - model: authentik_stages_email.emailstage
        id: recovery-email
        identifiers:
          name: default-recovery-email
        attrs:
          use_global_settings: true
          token_expiry: minutes=30
          subject: Reset your homelab password
          template: email/password_reset.html
          activate_user_on_success: true
          recovery_max_attempts: 5
          recovery_cache_timeout: minutes=5
      - model: authentik_stages_prompt.prompt
        id: recovery-field-password
        identifiers:
          name: default-recovery-field-password
        attrs:
          field_key: password
          label: Password
          type: password
          required: true
          placeholder: Password
          order: 0
          placeholder_expression: false
      - model: authentik_stages_prompt.promptstage
        id: recovery-prompt
        identifiers:
          name: default-recovery-prompt
        attrs:
          fields:
            - !KeyOf recovery-field-password
      - model: authentik_stages_user_write.userwritestage
        id: recovery-user-write
        identifiers:
          name: default-recovery-user-write
        attrs:
          user_creation_mode: never_create
      - model: authentik_stages_user_login.userloginstage
        id: recovery-user-login
        identifiers:
          name: default-recovery-user-login
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 10
          stage: !KeyOf recovery-identification
          target: !KeyOf recovery-flow
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 20
          stage: !KeyOf recovery-email
          target: !KeyOf recovery-flow
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 30
          stage: !KeyOf recovery-prompt
          target: !KeyOf recovery-flow
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 40
          stage: !KeyOf recovery-user-write
          target: !KeyOf recovery-flow
      - model: authentik_flows.flowstagebinding
        identifiers:
          order: 100
          stage: !KeyOf recovery-user-login
          target: !KeyOf recovery-flow
      # Puts the "Forgot password?" link on the login screen; without it the flow is only reachable by URL.
      - model: authentik_stages_identification.identificationstage
        identifiers:
          name: default-authentication-identification
        attrs:
          # Restated because the serializer rejects an entry with no user fields and no sources.
          user_fields:
            - email
            - username
          recovery_flow: !KeyOf recovery-flow
  applications.yaml: |-
    version: 1
    metadata:
      name: Homelab OIDC clients
    entries:
      # Every lookup below lives in a shipped blueprint, and blueprint order across files is undefined.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: System - OAuth2 Provider - Scopes
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Provider authorization flow (implicit consent)
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: Default - Invalidation flow
          required: true
      # The four consumers. Secrets are the ones the consumers already hold, mirrored from OpenBao
      # by ESO. grant_types is explicit because the model default is empty and the authorize
      # endpoint rejects a grant type the provider does not list.
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: argocd
        attrs:
          client_type: confidential
          client_id: argocd
          client_secret: !Env BLUEPRINT_OIDC_ARGOCD_SECRET
          grant_types: [authorization_code, refresh_token]
          include_claims_in_id_token: true
          sub_mode: user_username
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.icaninto.space/auth/callback
            - matching_mode: strict
              url: https://argocd.icaninto.space/pkce/verify
            - matching_mode: strict
              url: http://localhost:8085/auth/callback
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: grafana
        attrs:
          client_type: confidential
          client_id: grafana
          client_secret: !Env BLUEPRINT_OIDC_GRAFANA_SECRET
          grant_types: [authorization_code, refresh_token]
          include_claims_in_id_token: true
          sub_mode: user_username
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.icaninto.space/login/generic_oauth
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: headlamp
        attrs:
          client_type: confidential
          client_id: headlamp
          client_secret: !Env BLUEPRINT_OIDC_HEADLAMP_SECRET
          grant_types: [authorization_code, refresh_token]
          include_claims_in_id_token: true
          sub_mode: user_username
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
          # Headlamp derives the callback from the request host, so both hostnames are registered.
          redirect_uris:
            - matching_mode: strict
              url: https://headlamp.icaninto.space/oidc-callback
            - matching_mode: strict
              url: https://headlamp.taile70903.ts.net/oidc-callback
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: openbao
        attrs:
          client_type: confidential
          client_id: openbao
          client_secret: !Env BLUEPRINT_OIDC_OPENBAO_SECRET
          grant_types: [authorization_code, refresh_token]
          include_claims_in_id_token: true
          sub_mode: user_username
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'openid'"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'email'"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "authentik default OAuth Mapping: OpenID 'profile'"]]
          redirect_uris:
            - matching_mode: strict
              url: https://bao.icaninto.space/ui/vault/auth/oidc/oidc/callback
            - matching_mode: strict
              url: https://openbao.taile70903.ts.net/ui/vault/auth/oidc/oidc/callback
            - matching_mode: strict
              url: http://localhost:8250/oidc/callback
      # The slug is the issuer path (/application/o/<slug>/) and the client the provider serves.
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: ArgoCD
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, argocd]]
      - model: authentik_core.application
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, grafana]]
      - model: authentik_core.application
        identifiers:
          slug: headlamp
        attrs:
          name: Headlamp
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, headlamp]]
      - model: authentik_core.application
        identifiers:
          slug: openbao
        attrs:
          name: OpenBao
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, openbao]]
