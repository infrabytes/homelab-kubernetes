apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlantis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://runatlantis.github.io/helm-charts
    chart: atlantis
    targetRevision: 7.0.1
    helm:
      releaseName: atlantis
      values: |
        orgAllowlist: github.com/infrabytes/homelab-kubernetes
        # v0.49.0 images ship no terraform/tofu binary, so these are what make the
        # server start and every project plan. The version must match
        # atlantis.yaml's terraform_version; it also drives Atlantis's own copy
        # (/atlantis-data/bin/tofu<version>), which the terragrunt workflow never uses.
        defaultTFDistribution: opentofu
        defaultTFVersion: "1.13.9"
        atlantisUrl: https://atlantis.icaninto.space
        # SWAG terminates TLS on the host and proxies to this NodePort.
        service:
          type: NodePort
          nodePort: 30414
        # The chart's default Ingress has no class, never gets an address, and keeps the app Progressing.
        ingress:
          enabled: false
        # ArgoCD never runs `helm test`, so the unsized bats hook Pod is not worth rendering.
        test:
          enabled: false
        # Secret keys staged by ansible/windrunner-k3s.yml: GitHub user/token/webhook secret, API secret, SOPS age key.
        loadEnvFromSecrets:
          - atlantis-env
        environment:
          ATLANTIS_AUTOMERGE: "true"
          ATLANTIS_AUTOMERGE_METHOD: squash
          ATLANTIS_ENABLE_DIFF_MARKDOWN_FORMAT: "true"
          ATLANTIS_HIDE_PREV_PLAN_COMMENTS: "true"
        repoConfig: |
          repos:
            - id: github.com/infrabytes/homelab-kubernetes
              allowed_overrides: [workflow, apply_requirements]
              allow_custom_workflows: true
        # PATH-injected toolchain: terragrunt (workflow), sops (env.hcl), kubectl
        # (converge local-exec), tofu. tofu has to sit here under its plain name
        # because terragrunt resolves the binary as `tofu` from PATH: Atlantis's
        # own download is named `tofu<version>`, which terragrunt never looks for.
        initConfig:
          enabled: true
          image: alpine:3.24
          # The four binaries total 305MiB; the chart's 300Mi default evicts the pod
          # ("Usage of EmptyDir volume init-shared-path exceeds the limit 300Mi").
          sizeLimit: 512Mi
          script: |
            #!/bin/sh
            set -eu
            TOFU_VERSION=1.13.9
            wget -q -O "$INIT_SHARED_DIR/terragrunt" \
              https://github.com/gruntwork-io/terragrunt/releases/download/v1.2.1/terragrunt_linux_amd64
            wget -q -O "$INIT_SHARED_DIR/sops" \
              https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
            wget -q -O "$INIT_SHARED_DIR/kubectl" \
              https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
            wget -q -O /tmp/tofu.zip \
              "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
            unzip -qo /tmp/tofu.zip tofu -d "$INIT_SHARED_DIR"
            chmod 755 "$INIT_SHARED_DIR/terragrunt" "$INIT_SHARED_DIR/sops" "$INIT_SHARED_DIR/kubectl" "$INIT_SHARED_DIR/tofu"
        # Sizing: one docker stats sample (604MiB RSS, 2026-10-23); the host kept no history for a p95, so the 2Gi limit is headroom for tofu/terragrunt peaks, not a derivation.
        resources:
          requests:
            cpu: 50m
            memory: 768Mi
          limits:
            memory: 2Gi
        volumeClaim:
          enabled: true
          dataStorage: 5Gi
          storageClassName: local-path
        # The credential home Terragrunt writes/reads (kubeconfig, talosconfig,
        # viewer-kubeconfig and the inline manifests) must survive pod rolls, or
        # every restart re-plans those local_sensitive_file resources as creates.
        # The bucket sync in infra/scripts/sync-artifacts.sh still heals a fresh PVC.
        extraManifests:
          - apiVersion: v1
            kind: PersistentVolumeClaim
            metadata:
              name: atlantis-credentials
            spec:
              accessModes: [ReadWriteOnce]
              storageClassName: local-path
              resources:
                requests:
                  storage: 1Gi
        extraVolumes:
          - name: atlantis-credentials
            persistentVolumeClaim:
              claimName: atlantis-credentials
        extraVolumeMounts:
          - name: atlantis-credentials
            mountPath: /var/tmp/homelab-artifacts
  destination:
    name: windrunner
    namespace: atlantis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
