# Kyverno enforces the resource declarations a chart-render script used to check at PR time
# (see require-resources.yaml); the operator UIs and the policy reports are a bonus.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.9.2
      helm:
        releaseName: kyverno
        values: |
          # New component (2026-10-26): initial estimate from the chart defaults, re-measure
          # after two weeks. Only the admission controller is pinned; background, cleanup and
          # reports keep the chart's 100m/64Mi requests and 128Mi limit, which already comply.
          admissionController:
            replicas: 1
            container:
              resources:
                requests:
                  cpu: 50m
                  memory: 192Mi
                limits:
                  memory: 384Mi
            initContainer:
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
    - repoURL: https://github.com/infrabytes/homelab-kubernetes
      targetRevision: main
      path: platform/kyverno
      directory:
        recurse: true
        exclude: "application*.yaml"
  destination:
    namespace: kyverno
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # 22 CRDs exceed the 256KB last-applied cap; SSA over the note's Replace, which would wipe the cert-controller's webhook caBundle.
      - ServerSideApply=true
  ignoreDifferences:
    # The aggregation controller owns `rules` on the four controller roles.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kyverno:admission-controller
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kyverno:background-controller
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kyverno:cleanup-controller
      jsonPointers:
        - /rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kyverno:reports-controller
      jsonPointers:
        - /rules
    # kyverno-api renders `labels: {}` on its policy CRDs, which the API server drops: permanent OutOfSync otherwise.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels
