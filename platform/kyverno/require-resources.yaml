# Kyverno's best-practices "require requests and limits" policy, enforced instead of
# audited: it replaces the chart-render check that read every Application's values at PR
# time (deleted with check-argocd-apps.py). A missing request now fails admission, which
# Argo CD reports as a sync failure on the workload's Application.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resources
  annotations:
    policies.kyverno.io/title: Require Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Every container, init container and ephemeral container must declare CPU and
      memory requests and a memory limit.
spec:
  # A Kyverno outage must not block the cluster's workloads: an unevaluated pod is
  # admitted, and the policy report shows it once Kyverno is back.
  failurePolicy: Ignore
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ''
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchConditions:
    # Excluded namespaces hold containers this repository has no values knob for:
    # chart internals (longhorn, k8s-monitoring, spegel, ARC, NATS, velero's maintenance
    # jobs, the vcluster-synced preview Argo CD, tailscale's operator pods), Talos/Cilium
    # static pods, and the policy engine itself. Everything the operator writes values
    # for stays enforced.
    - name: not-a-chart-internal-namespace
      expression: >-
        !(object.metadata.?namespace.orValue('') in
        ['kube-system', 'kyverno', 'longhorn-system', 'k8s-monitoring', 'spegel',
         'tailscale', 'vcluster', 'velero', 'alert-triage', 'arc-systems', 'arc-runners',
         'openbao', 'atlantis'])
  validationActions:
    - Deny
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c, has(c.resources) &&
        has(c.resources.requests) && has(c.resources.requests.memory) &&
        c.resources.requests.memory != '' && has(c.resources.requests.cpu) &&
        c.resources.requests.cpu != '' && has(c.resources.limits) &&
        has(c.resources.limits.memory) && c.resources.limits.memory != '')
      message: >-
        CPU and memory resource requests and memory limits are required for containers.
