apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: gha-runner-tool-cache
  namespace: arc-runners
  labels:
    app.kubernetes.io/part-of: gha-runner-scale-set
    app.kubernetes.io/component: tool-cache
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-rwx-cache
  resources:
    requests:
      storage: 10Gi
