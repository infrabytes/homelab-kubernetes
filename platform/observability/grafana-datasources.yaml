# Datasource provisioning file, mounted by the Grafana CR at /etc/grafana/provisioning/datasources
# because the GrafanaDatasource CRD cannot express correlations. Provisioning runs on pod
# start only, and the operator's ConfigMap watch does not retrigger the Grafana CR (v5.25):
# bump grafana-datasources-revision in grafana.yaml after edits. Keep name/uid stable -
# provisioning upserts by name and dashboards reference the uids.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: victoriametrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://vmsingle-victoria-metrics-single-server.observability.svc.cluster.local:8428
        isDefault: true
        jsonData:
          httpMethod: POST
        # One correlation per metric: field = the metric name (value-field name); links
        # render in the Explore graph tooltip (pin on a point) only - Explore 13 has no
        # Prometheus table section, its raw instant view shows none, and dashboard
        # panels do not render them either on 13.1.3 (probed 2026-10-17, including the
        # CNPG chart dashboard). Dashboards that want log links in cells use fieldConfig
        # data links instead: see dashboards/debug-workloads.yaml. `pod` is Loki
        # structured metadata (post-selector filter). A missing description panics the
        # parser; $$ escapes provisioning's $VAR expansion.
        correlations:
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: kube_pod_status_phase
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: kube_pod_container_status_restarts_total
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: container_cpu_usage_seconds_total
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: container_memory_working_set_bytes
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_cpu_seconds_total
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_load1
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_memory_MemAvailable_bytes
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_filesystem_avail_bytes
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Namespace events
            description: Kubernetes events for this PVC's namespace
            type: query
            config:
              field: kubelet_volume_stats_available_bytes
              target:
                expr: '{namespace="$${__field.labels.namespace}", source="kubernetes-events"}'
                queryType: range
          # --- 2026-10 expansion, same `{namespace} | pod="..."` pattern as above. ---
          # Tiers chosen against the dashboard-metric inventory (every field is queried
          # by a deployed dashboard AND allowlisted in k8s-monitoring includeMetrics).
          # Pod-level k8s workloads: terminated/waiting complete the pod_status_phase
          # coverage; cfs-throttled and network errors/drops are the cAdvisor allowlist
          # metrics the Views dashboards read.
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: kube_pod_container_status_last_terminated_reason
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: kube_pod_container_status_terminated
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: kube_pod_container_status_waiting
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: container_cpu_cfs_throttled_seconds_total
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: container_network_receive_errors_total
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: container_network_transmit_errors_total
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: container_network_receive_packets_dropped_total
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Pod logs
            description: Loki logs for this pod
            type: query
            config:
              field: container_network_transmit_packets_dropped_total
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          # Talos node level: `{node=...}` matches the syslog stream label set by the
          # k8s-monitoring chart's talos loki.process pipeline (platform/k8s-monitoring).
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_load5
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_load15
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_softnet_dropped_total
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_network_receive_errs_total
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_network_transmit_errs_total
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_disk_io_time_seconds_total
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_vmstat_oom_kill
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_pressure_memory_stalled_seconds_total
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          - targetUID: loki
            label: Talos node service logs
            description: Node service logs for this Talos node
            type: query
            config:
              field: node_cpu_core_throttles_total
              target:
                expr: '{node="$${__field.labels.instance}"}'
                queryType: range
          # Cilium agent pods: all cilium_* agent metrics carry k8s_app plus the
          # reporting agent pod; the agent's logs live in kube-system.
          - targetUID: loki
            label: Cilium agent logs
            description: Cilium agent logs for this reporting agent pod
            type: query
            config:
              field: cilium_drop_count_total
              target:
                expr: '{namespace="kube-system"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Cilium agent logs
            description: Cilium agent logs for this reporting agent pod
            type: query
            config:
              field: cilium_policy_change_total
              target:
                expr: '{namespace="kube-system"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Cilium agent logs
            description: Cilium agent logs for this reporting agent pod
            type: query
            config:
              field: cilium_errors_warnings_total
              target:
                expr: '{namespace="kube-system"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Cilium agent logs
            description: Cilium agent logs for this reporting agent pod
            type: query
            config:
              field: cilium_bpf_map_pressure
              target:
                expr: '{namespace="kube-system"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: Cilium agent logs
            description: Cilium agent logs for this reporting agent pod
            type: query
            config:
              field: cilium_endpoint_regenerations_total
              target:
                expr: '{namespace="kube-system"} | pod="$${__field.labels.pod}"'
                queryType: range
          # CloudNativePG instance pods: namespace+pod are real matchers on the cnpg_
          # exporter metrics.
          - targetUID: loki
            label: CNPG pod logs
            description: Postgres instance pod logs
            type: query
            config:
              field: cnpg_backends_waiting_total
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: CNPG pod logs
            description: Postgres instance pod logs
            type: query
            config:
              field: cnpg_pg_replication_lag
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: CNPG pod logs
            description: Postgres instance pod logs
            type: query
            config:
              field: cnpg_pg_stat_database_deadlocks
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          - targetUID: loki
            label: CNPG pod logs
            description: Postgres instance pod logs
            type: query
            config:
              field: cnpg_collector_last_collection_error
              target:
                expr: '{namespace="$${__field.labels.namespace}"} | pod="$${__field.labels.pod}"'
                queryType: range
          # External cross-tool pilot: links render on ANY victoriametrics result field
          # named `namespace`, so it appears in the label `namespace` table columns of
          # network-policies, CloudNativePG and external-secrets dashboards (their only
          # table panels). The ArgoCD dashboard itself has no table panels, so the link
          # cannot show there - it only surfaces on other dashboards' namespace columns.
          # targetUID is provisioned but unused for external correlations (schema keeps
          # it required); delete this block if the link misleads more than it helps.
          - targetUID: loki
            label: Open in ArgoCD
            description: ArgoCD apps filtered to this namespace
            type: external
            config:
              field: namespace
              target:
                url: https://argocd.icaninto.space/applications?search=$${__value.raw}
      - name: loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
