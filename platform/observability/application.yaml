# Grafana CRs, dashboards, alerting and the PG cluster behind them; the operator, Loki and VictoriaMetrics are
# separate Applications in this folder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/infrabytes/homelab-kubernetes
    targetRevision: main
    path: platform/observability
    directory:
      recurse: true
      exclude: "application*.yaml"
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Server-side apply: the vendored 1860 ConfigMap is 468 KB, over the 256KB last-applied-configuration limit.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
