# Degraded in ArgoCD until its GrafanaFolder health check learns the negative-polarity
# FolderUIDMismatch condition (upstream #29395, not in v3.5.2); cosmetic.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: talos
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      grafanaInstance: main
  title: Talos
  uid: talos
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: cilium
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      grafanaInstance: main
  title: Cilium
  uid: cilium
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: logs
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      grafanaInstance: main
  title: Logs
  uid: logs
