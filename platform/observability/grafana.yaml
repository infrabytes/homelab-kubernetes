apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    grafanaInstance: main
spec:
  # Admin credentials come from the SOPS-backed grafana-admin-credentials Secret below.
  disableDefaultAdminSecret: true
  config:
    server:
      root_url: https://grafana.icaninto.space/
    # Database is the CloudNativePG cluster in grafana-postgres.yaml; the password comes from the secret it generates.
    database:
      type: postgres
      host: grafana-pg-rw.observability.svc.cluster.local
      name: grafana
      user: grafana
      ssl_mode: require
    # LAN path: Dex (GitHub); the tailnet path reads the ingress proxy's Tailscale identity header.
    auth.generic_oauth:
      enabled: "true"
      name: GitHub
      allow_sign_up: "true"
      client_id: grafana
      scopes: openid profile email
      auth_url: https://dex.icaninto.space/auth
      token_url: https://dex.icaninto.space/token
      api_url: https://dex.icaninto.space/userinfo
      login_attribute_path: preferred_username
      # Matches both identities: the tailnet proxy sends `bbayrakt@github`, the LAN Dex login `bbayrakt`.
      role_attribute_path: "contains(preferred_username, 'bbayrakt') && 'GrafanaAdmin' || 'Viewer'"
      # Without this Grafana caps the mapped role at Admin, so the GrafanaAdmin above never lands.
      allow_assign_grafana_admin: "true"
      use_pkce: "true"
    auth.proxy:
      enabled: "true"
      header_name: Tailscale-User-Login
      header_property: username
      auto_sign_up: "true"
      # Only the Tailscale ingress proxy (pod CIDR) may assert the identity header.
      whitelist: 10.244.0.0/16
  deployment:
    spec:
      template:
        metadata:
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          # Grafana resolves the Dex issuer server-side (OIDC discovery + token exchange); the LAN name is not in cluster DNS, so pin it.
          hostAliases:
            - ip: 192.168.0.200
              hostnames:
                - dex.icaninto.space
          volumes:
            - name: grafana-datasources
              configMap:
                name: grafana-datasources
          containers:
            - name: grafana
              env:
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-pg-app
                      key: password
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth-credentials
                      key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                - name: GF_SECURITY_ADMIN_USER
                  value: admin
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-credentials
                      key: GF_SECURITY_ADMIN_PASSWORD
              # 36d (2026-09-16..10-22, local VM): ws p95 494Mi → request 512Mi, limit 768Mi
              # (1.5x request, 1.25x peak 497Mi). The old 512Mi limit pinned ws at 0.96 (RSS 203Mi).
              resources:
                requests:
                  cpu: 140m
                  memory: 512Mi
                limits:
                  memory: 768Mi
              volumeMounts:
                - name: grafana-datasources
                  mountPath: /etc/grafana/provisioning/datasources
