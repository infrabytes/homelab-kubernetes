apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: container-logs
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      grafanaInstance: main
  folderRef: logs
  resyncPeriod: 1h
  configMapRef:
    name: container-logs
    key: container-logs.json
  datasources:
    - inputName: DS_LOKI
      datasourceName: loki
