# GitHub Actions runner dashboard: which workflow jobs consume the pool, how jobs
# fail, queue-vs-execution latency, pool saturation and per-pod resources. ARC
# listener metrics carry organization/repository/event_name/job_name/job_result,
# so workflow attribution here is the job key (this repo runs one job per
# workflow); `runner-minutes` comes from the execution-duration histogram sum.
# The failure columns are summed as `failed or (started * 0)` so a range without
# failures keeps the column instead of dropping it from the join.
# Run-level links come from the GitHub API datasource (platform/observability/
# grafana-github-datasource.yaml); runner job lines come from Loki.
apiVersion: v1
kind: ConfigMap
metadata:
  name: github-actions
  namespace: observability
data:
  github-actions.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "GitHub Actions runner pool: which workflows consume it, how jobs fail, queue vs execution time, pool saturation and per-pod resources. Metrics come from the ARC listener/controller, run links from the GitHub API data source, job logs from Loki.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": true,
          "title": "All runs on GitHub",
          "tooltip": "infrabytes/homelab-kubernetes actions",
          "type": "link",
          "url": "https://github.com/infrabytes/homelab-kubernetes/actions"
        },
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "tags": [],
          "targetBlank": true,
          "title": "Runner pool pods",
          "tooltip": "arc-runners namespace in ArgoCD",
          "type": "link",
          "url": "https://argocd.icaninto.space/applications?search=arc-runners"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Overview",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Completed runner jobs in the selected range (succeeded + failed + canceled).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(gha_completed_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range]))",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Jobs completed",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Jobs whose runner reported a failed result. Click through the run tables below to open the failing run.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(gha_completed_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\",job_result=\"failed\"}[$__range]))",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Failed jobs",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Failed / completed jobs. Canceled jobs count as completed but not failed.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 30
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "100 * sum(increase(gha_completed_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\",job_result=\"failed\"}[$__range])) / clamp_min(sum(increase(gha_completed_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])), 1)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Failure rate",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Sum of job execution time (queue wait excluded). This is the pool capacity the workflows actually consumed.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum(increase(gha_job_execution_duration_seconds_sum{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])) / 60",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Runner-minutes",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "95th percentile time a job waited between being queued and starting on a runner.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 60
                  },
                  {
                    "color": "red",
                    "value": 180
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (increase(gha_job_startup_duration_seconds_bucket{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])))",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Queue wait p95",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Jobs assigned to the scale set that have no runner executing them yet (current value).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "clamp_min(sum(gha_assigned_jobs{job=\"arc-listeners\"}) - sum(gha_running_jobs{job=\"arc-listeners\"}), 0)",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Queued jobs",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 8,
          "panels": [],
          "title": "Which workflows use the runners",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Execution time per GitHub job, ranked. Job names are the workflow job keys (one job per workflow here); the table on the right links each row to its workflow on GitHub.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-GrYlRd"
              },
              "links": [],
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 9,
            "x": 0,
            "y": 6
          },
          "id": 9,
          "options": {
            "displayMode": "gradient",
            "minVizHeight": 16,
            "minVizWidth": 8,
            "namePlacement": "auto",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showUnfilled": true,
            "sizing": "auto",
            "valueMode": "color"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (job_name) (increase(gha_job_execution_duration_seconds_sum{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])) / 60",
              "legendFormat": "{{job_name}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "Runner-minutes by workflow job",
          "type": "bargauge"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "One row per GitHub job (one job per workflow in this repo): job count, failures, runner-minutes consumed, queue wait and execution percentiles. Click a workflow job to open its runs on GitHub.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false,
                "inspect": false
              },
              "links": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "workflow job"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "targetBlank": true,
                        "title": "Open workflow on GitHub",
                        "url": "https://github.com/infrabytes/homelab-kubernetes/actions/workflows/${__data.fields[\"workflow_file\"]}"
                      },
                      {
                        "targetBlank": true,
                        "title": "Open runs on main",
                        "url": "https://github.com/infrabytes/homelab-kubernetes/actions/workflows/${__data.fields[\"workflow_file\"]}?query=branch%3Amain"
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "workflow file"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "legend": true,
                      "tooltip": false,
                      "viz": true
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 150
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "jobs"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 70
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "failed"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 70
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 3
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "failure %"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 90
                  },
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 10
                        },
                        {
                          "color": "red",
                          "value": 30
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "runner-min"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 100
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "queue p50"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "queue p95"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "run p50"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "run p95"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 9,
            "w": 15,
            "x": 9,
            "y": 6
          },
          "id": 10,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "runner-min"
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (job_name) (increase(gha_completed_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range]))",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (job_name) (increase(gha_completed_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\",job_result=\"failed\"}[$__range])) or (sum by (job_name) (increase(gha_started_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])) * 0)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "100 * (sum by (job_name) (increase(gha_completed_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\",job_result=\"failed\"}[$__range])) or (sum by (job_name) (increase(gha_started_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])) * 0)) / clamp_min(sum by (job_name) (increase(gha_completed_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])), 1)",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "sum by (job_name) (increase(gha_job_execution_duration_seconds_sum{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])) / 60",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "histogram_quantile(0.5, sum by (le, job_name) (increase(gha_job_startup_duration_seconds_bucket{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])))",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "histogram_quantile(0.95, sum by (le, job_name) (increase(gha_job_startup_duration_seconds_bucket{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])))",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "F"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "histogram_quantile(0.5, sum by (le, job_name) (increase(gha_job_execution_duration_seconds_bucket{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])))",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "G"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "histogram_quantile(0.95, sum by (le, job_name) (increase(gha_job_execution_duration_seconds_bucket{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])))",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "H"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "expr": "label_replace(label_replace(label_replace(sum by (job_name) (increase(gha_started_jobs_total{job=\"arc-listeners\",job_name=~\"${job:regex}\"}[$__range])), \"workflow_file\", \"pre-commit.yaml\", \"job_name\", \"pre-commit\"), \"workflow_file\", \"pr-preview.yaml\", \"job_name\", \"preview\"), \"workflow_file\", \"warm-tool-cache.yaml\", \"job_name\", \"warm\")",
              "format": "table",
              "instant": true,
              "range": false,
              "refId": "I"
            }
          ],
          "title": "Workflow usage (runner truth)",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "job_name",
                "mode": "outer"
              }
            },
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "pattern": "^(?!Time).*"
                }
              }
            },
            {
              "id": "organize",
