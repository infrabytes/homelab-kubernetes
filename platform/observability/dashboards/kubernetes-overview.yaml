          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum(container_memory_working_set_bytes{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\"})",
              "instant": true,
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Memory Usage",
          "type": "stat"
