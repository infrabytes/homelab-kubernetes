# Hand-authored triage dashboard: click cells for fieldConfig data links. The
# Pod logs internal link needs internal.query (not panelsState.queries); without
# it Grafana builds Explore URLs containing queries:[null]. It uses the row's
# namespace and clicked pod value. ArgoCD apps are listed separately by their
# destination namespace; pod and namespace names are not Application names.
# To force the Grafana Operator to re-fetch the ConfigMap after edits, change
# the GrafanaDashboard spec's resyncPeriod in tandem (alternate 1h / 59m).
# Metadata annotations do not bump generation, and a periodic resync may replay
# the last applied dashboard content. Targets remain raw selectors so metric
# columns keep their names; counters are cumulative since boot.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-workloads
  namespace: kube-system
data:
  debug-workloads.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Container restarts & phase (click a pod cell)",
          "description": "Instant counters per container/pod. Click a pod value, then choose Pod logs to open the matching namespace and pod in Loki.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "pluginVersion": "11.6.1",
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "pod"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Pod logs",
                        "internal": {
                          "datasourceUid": "loki",
                          "query": {
                            "expr": "{namespace=\"${__data.fields[\"namespace\"]}\"} | pod=\"${__value.raw}\"",
                            "queryType": "range",
                            "refId": "A",
                            "datasource": {
                              "type": "loki",
                              "uid": "loki"
                            }
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "kube_pod_container_status_waiting{namespace=~\"$namespace\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "kube_pod_container_status_terminated{namespace=~\"$namespace\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "kube_pod_container_status_last_terminated_reason{namespace=~\"$namespace\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "D"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "cluster": true,
                  "job": true,
                  "k8s_cluster_name": true,
                  "instance": true,
                  "source": true,
                  "uid": true
                },
                "indexByName": {
                  "namespace": 0,
                  "pod": 1,
                  "container": 2,
                  "kube_pod_container_status_restarts_total": 3,
                  "kube_pod_container_status_waiting": 4,
                  "kube_pod_container_status_terminated": 5,
                  "kube_pod_container_status_last_terminated_reason": 6
                }
              }
            }
          ],
          "options": {
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false
            },
            "showHeader": true
          }
        },
        {
          "id": 2,
          "type": "table",
          "title": "Throttling & network drops (click a pod cell)",
          "description": "Instant counters per container/pod. Click a pod value, then choose Pod logs to open the matching namespace and pod in Loki.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "pluginVersion": "11.6.1",
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "pod"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Pod logs",
                        "internal": {
                          "datasourceUid": "loki",
                          "query": {
                            "expr": "{namespace=\"${__data.fields[\"namespace\"]}\"} | pod=\"${__value.raw}\"",
                            "queryType": "range",
                            "refId": "A",
                            "datasource": {
                              "type": "loki",
                              "uid": "loki"
                            }
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "container_cpu_cfs_throttled_seconds_total{namespace=~\"$namespace\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "container_network_receive_packets_dropped_total{namespace=~\"$namespace\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "container_network_transmit_packets_dropped_total{namespace=~\"$namespace\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "C"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "cluster": true,
                  "job": true,
                  "k8s_cluster_name": true,
                  "instance": true,
                  "source": true,
                  "uid": true,
                  "image": true
                },
                "indexByName": {
                  "namespace": 0,
                  "pod": 1,
                  "container": 2,
                  "container_cpu_cfs_throttled_seconds_total": 3,
                  "container_network_receive_packets_dropped_total": 4,
                  "container_network_transmit_packets_dropped_total": 5
                }
              }
            }
          ],
          "options": {
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false
            },
            "showHeader": true
          }
        },
        {
          "id": 3,
          "type": "table",
          "title": "Talos node signals (click a node cell)",
          "description": "Instant host metrics per Talos node. Click an instance value, then choose Talos node service logs to open that node in Loki.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 24
          },
          "pluginVersion": "11.6.1",
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "instance"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Talos node service logs",
                        "internal": {
                          "datasourceUid": "loki",
                          "query": {
                            "expr": "{node=\"${__value.raw}\"}",
                            "queryType": "range",
                            "refId": "A",
                            "datasource": {
                              "type": "loki",
                              "uid": "loki"
                            }
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "node_load5",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "node_softnet_dropped_total",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "node_network_receive_errs_total",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "node_network_transmit_errs_total",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "node_pressure_memory_stalled_seconds_total",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "E"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "node_vmstat_oom_kill",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "F"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "cluster": true,
                  "job": true,
                  "k8s_cluster_name": true,
                  "source": true,
                  "uid": true,
                  "app": true,
                  "component": true,
                  "container": true,
                  "namespace": true,
                  "pod": true,
                  "workload": true,
                  "node": true
                },
                "indexByName": {
                  "instance": 0,
                  "node_load5": 1,
                  "node_softnet_dropped_total": 2,
                  "node_network_receive_errs_total": 3,
                  "node_network_transmit_errs_total": 4,
                  "node_pressure_memory_stalled_seconds_total": 5,
                  "node_vmstat_oom_kill": 6
                }
              }
            }
          ],
          "options": {
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false
            },
            "showHeader": true
          }
        },
        {
          "id": 4,
          "type": "table",
          "title": "ArgoCD applications in selected namespace",
          "description": "Lists ArgoCD applications by destination namespace. Click an application name to open ArgoCD search for that app; a pod or namespace name is not an ArgoCD application name.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 36
          },
          "pluginVersion": "11.6.1",
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "name"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Open ArgoCD application",
                        "targetBlank": true,
                        "url": "https://argocd.icaninto.space/applications?search=${__value.raw}"
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "argocd_app_info{dest_namespace=~\"$namespace\"}",
              "instant": true,
              "format": "table",
              "legendFormat": "__auto",
              "range": false,
              "refId": "A"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "cluster": true,
                  "container": true,
                  "endpoint": true,
                  "exported_namespace": true,
                  "instance": true,
                  "job": true,
                  "k8s_cluster_name": true,
                  "namespace": true,
                  "pod": true,
                  "project": true,
                  "repo": true,
                  "service": true,
                  "dest_server": true
                },
                "indexByName": {
                  "dest_namespace": 0,
                  "name": 1,
                  "health_status": 2,
                  "sync_status": 3
                }
              }
            }
          ],
          "options": {
            "cellHeight": "sm",
            "footer": {
              "show": false,
              "reducer": [
                "sum"
              ],
              "countRows": false
            },
            "showHeader": true
          }
        }
      ],
      "refresh": "1m",
      "schemaVersion": 39,
      "tags": [
        "homelab",
        "debug"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "includeAll": true,
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(kube_pod_info, namespace)",
              "refId": "std-namespace-variable"
            },
            "refresh": 1,
            "regex": "",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            }
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Debug: workloads & nodes",
      "uid": "homelab-debug",
      "version": 4,
      "weekStart": ""
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: debug-workloads
  namespace: kube-system
  annotations:
    dashboard-revision: '3'
spec:
  instanceSelector:
    matchLabels:
      grafanaInstance: main
  allowCrossNamespaceImport: true
  folder: kubernetes
  resyncPeriod: 59m
  configMapRef:
    name: debug-workloads
    key: debug-workloads.json
