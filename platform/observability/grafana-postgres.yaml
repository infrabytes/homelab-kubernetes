apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-pg
  namespace: observability
spec:
  instances: 1
  storage:
    size: 5Gi
    storageClass: longhorn
  # Initial estimate (2026-09-17); re-measure after two weeks. Holds Grafana's own metadata only —
  # dashboards, alert rules, datasources and folders are all re-provisioned from their CRs.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      owner: grafana
      database: grafana
  backup:
    retentionPolicy: "14d"
    barmanObjectStore:
      # Same SeaweedFS bucket as the Terraform state; the prefix keeps them apart.
      destinationPath: s3://homelab-kubernetes/grafana-pg
      endpointURL: https://s3.icaninto.space
      s3Credentials:
        accessKeyId:
          name: grafana-pg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: grafana-pg-backup-s3
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: grafana-pg-daily
  namespace: observability
spec:
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster:
    name: grafana-pg
