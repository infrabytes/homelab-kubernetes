apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-pg
  namespace: observability
spec:
  instances: 1
  # One instance: the operator PDB (minAvailable 1) can never allow an eviction, it only blocks node drains.
  enablePDB: false
  storage:
    size: 5Gi
    storageClass: longhorn
  # Initial estimate (2026-09-17); re-measure after two weeks. Holds Grafana's own metadata only —
  # dashboards, alert rules, datasources and folders are all re-provisioned from their CRs.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      owner: grafana
      database: grafana
