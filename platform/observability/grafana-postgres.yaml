apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-pg
  namespace: observability
spec:
  instances: 2
  # 2 instances: the standby keeps Grafana's DB up through node drains/upgrades;
  # required anti-affinity keeps it off the primary's node. The operator PDB
  # (minAvailable instances-1) now allows exactly one eviction — with 1
  # instance it could only block drains, hence enablePDB was off.
  enablePDB: true
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  storage:
    size: 5Gi
    storageClass: longhorn
  # Initial estimate (2026-09-17); re-measure after two weeks. Holds Grafana's own metadata only —
  # dashboards, alert rules, datasources and folders are all re-provisioned from their CRs.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      owner: grafana
      database: grafana
