apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-metrics-single
    targetRevision: 0.48.0
    helm:
      releaseName: vmsingle
      values: |
        server:
          retentionPeriod: 90d
          persistentVolume:
            storageClassName: nfs-nas
            size: 30Gi
          extraArgs:
            # A full NAS must go read-only instead of failing writes.
            storage.minFreeDiskSpaceBytes: 5GB
          serviceMonitor:
            enabled: true
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 1.5Gi
          # NFS volume must stay out of Velero fs-backup; kopia would read it off the NAS.
          podAnnotations:
            backup.velero.io/backup-volumes-excludes: server-volume
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
