# ServerSideApply: the Grafana CRD (~600KB) exceeds the client-side-apply annotation limit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana-operator
    targetRevision: 5.25.0
    helm:
      releaseName: grafana-operator
      values: |
        # Seccomp profile missing from the chart defaults (PSA restricted warning).
        securityContext:
          seccompProfile:
            type: RuntimeDefault
        # New component (2026-09-12): initial estimate; re-measure after two weeks.
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    namespace: k8s-monitoring
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
