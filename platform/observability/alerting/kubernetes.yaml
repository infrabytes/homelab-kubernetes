      condition: threshold
      for: 15m
      noDataState: OK
      execErrState: Alerting
      annotations:
        summary: Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container
          }} is throttled in over 25% of its CFS periods
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/cputhrottlinghigh
      labels:
        severity: warning
      data:
        - refId: query
          queryType: prometheus
          datasourceUid: victoriametrics
          relativeTimeRange:
            from: 660
            to: 60
          model:
            datasource:
              type: prometheus
              uid: victoriametrics
            expr: sum without (id, metrics_path, name, image, endpoint, job, node)
              (topk by (cluster, namespace, pod, container, instance) (1, increase(container_cpu_cfs_throttled_periods_total{container!=""}[5m])))
              / on (cluster, namespace, pod, container, instance) group_left sum without
              (id, metrics_path, name, image, endpoint, job, node) (topk by (cluster,
              namespace, pod, container, instance) (1, increase(container_cpu_cfs_periods_total[5m])))
              > (25 / 100)
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            range: false
            refId: query
