      title: Node memory utilization high
      condition: threshold
      for: 15m
      noDataState: OK
      execErrState: Alerting
      annotations:
        summary: Node {{ $labels.instance }} memory utilization has been above 90%
          for 15m
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodememoryhighutilization
      labels:
        severity: warning
      data:
        - refId: query
          queryType: prometheus
          datasourceUid: victoriametrics
          relativeTimeRange:
            from: 660
            to: 60
          model:
            datasource:
              type: prometheus
              uid: victoriametrics
            # Hosts pin ~90% by construction (one 14 GiB VM on 16.66 GB RAM, no ballooning); only guests carry signal.
