    - uid: kube-cpu-overcommit
      title: Cluster CPU overcommitted
      condition: threshold
      for: 10m
      noDataState: OK
      execErrState: Alerting
      annotations:
        summary: Cluster CPU requests exceed allocatable CPU
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecpuovercommit
      labels:
        severity: warning
      data:
        - refId: query
          queryType: prometheus
          datasourceUid: victoriametrics
          relativeTimeRange:
            from: 660
            to: 60
          model:
            datasource:
              type: prometheus
              uid: victoriametrics
            expr: ((sum by (cluster) (kube_pod_container_resource_requests{resource="cpu"})
              - sum by (cluster) (kube_node_status_allocatable{resource="cpu"}) >
              0) and count by (cluster) (max by (cluster, node) (kube_node_role{role="control-plane"}))
              < 3) or (sum by (cluster) (kube_pod_container_resource_requests{resource="cpu"})
              - (sum by (cluster) (kube_node_status_allocatable{resource="cpu"}) -
              max by (cluster) (kube_node_status_allocatable{resource="cpu"})) > 0)
            instant: true
            intervalMs: 1000
            maxDataPoints: 43200
            range: false
            refId: query
        - refId: threshold
          queryType: threshold
          datasourceUid: __expr__
          relativeTimeRange:
            from: 0
            to: 0
          model:
            conditions:
              - evaluator:
                  params:
                    - -1
                  type: gt
            datasource:
              type: __expr__
              uid: __expr__
            expression: query
            intervalMs: 1000
            maxDataPoints: 43200
            refId: threshold
            type: threshold
