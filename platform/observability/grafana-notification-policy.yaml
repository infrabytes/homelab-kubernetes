# Applying this replaces the whole notification tree. Discord keeps today's behaviour
# (root group_wait 30s, critical sub-route group_wait 0s) and triage is a sibling route.
# Alertmanager stops at the first matching sibling unless that route sets `continue`, so
# the Discord route continues the walk and the Triage route picks the alert up too.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: default
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      grafanaInstance: main
  route:
    receiver: Discord
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: Discord
        continue: true
        object_matchers:
          - ["alertname", "=~", ".+"]
        group_wait: 30s
        routes:
          - receiver: Discord
            continue: true
            object_matchers:
              - ["severity", "=", "critical"]
            group_wait: 0s
            repeat_interval: 1h
      # Every alert also starts a triage sandbox; 24h repeat keeps a long-running alert
      # from re-triaging on every Discord repeat_interval.
      - receiver: Triage
        object_matchers:
          - ["alertname", "=~", ".+"]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 24h
