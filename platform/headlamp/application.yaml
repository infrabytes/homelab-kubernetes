# Headlamp dashboard, native OIDC login against the LAN Dex. User access lives
# in rbac.yaml, client credentials in the addons-owned headlamp-oidc Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.46.0
    helm:
      releaseName: headlamp
      values: |
        config:
          oidc:
            secret:
              create: false
            # OIDC_CLIENT_ID/_SECRET/_ISSUER_URL/_SCOPES come from the Terraform-owned Secret in infra/addons.
            externalSecret:
              enabled: true
              name: headlamp-oidc
              hasScopes: true
        # Chart default would be cluster-admin; the pod only proxies the user's own requests.
        clusterRoleBinding:
          clusterRoleName: cluster-viewer
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
        # Pin the issuer to the gateway L2 IP, bypassing LAN DNS rebinding (as the openbao chart does).
        hostAliases:
          - ip: 192.168.0.200
            hostnames:
              - dex.icaninto.space
        # First pass (2026-10-18), no usage history yet; re-measure after 2026-11-01.
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 192Mi
        podAnnotations:
          reloader.stakater.com/auto: "true"
  destination:
    namespace: headlamp
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
