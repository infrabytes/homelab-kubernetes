# Advertises only the gateway VIP (where dex.icaninto.space resolves) so remote
# browsers complete OIDC logins; the LAN subnet is not advertised (README.md).
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: lan-subnet-router
spec:
  hostname: homelab-subnet-router
  tags:
    - tag:k8s
  subnetRouter:
    advertiseRoutes:
      - 192.168.0.200/32
