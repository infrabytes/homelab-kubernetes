# Namespaced store: only this namespace's ExternalSecrets reach the operator OAuth path (OpenBao policy eso-tailscale).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-tailscale
  namespace: tailscale
spec:
  provider:
    openBao:
      server: https://openbao-public.openbao.svc:8200
      # The operator-generated in-cluster CA; the Secret is copied into this
      # namespace by the one-time runbook step (platform/openbao README).
      caProvider:
        type: Secret
        name: openbao-tls-ca
        key: ca.crt
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-tailscale
          serviceAccountRef:
            name: tailscale-eso
