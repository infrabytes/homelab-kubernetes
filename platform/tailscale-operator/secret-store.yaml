# Namespaced store: only this namespace's ExternalSecrets reach the operator OAuth path (OpenBao policy eso-tailscale).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-tailscale
  namespace: tailscale
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-tailscale
          serviceAccountRef:
            name: tailscale-eso
