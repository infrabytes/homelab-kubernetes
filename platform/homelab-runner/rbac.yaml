apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner
  namespace: arc-runners
---
# Read access to the preview-bot ArgoCD API token (PR validation dry-run syncs).
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-preview-bot
  namespace: arc-runners
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-preview-bot
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
roleRef:
  kind: Role
  name: arc-runner-preview-bot
  apiGroup: rbac.authorization.k8s.io
---
# Namespace existence check for the dry-run validation supplement (the ArgoCD dry-run misses a missing destination namespace).
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-namespace-read
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: arc-runner-namespace-read
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
roleRef:
  kind: ClusterRole
  name: arc-runner-namespace-read
  apiGroup: rbac.authorization.k8s.io
