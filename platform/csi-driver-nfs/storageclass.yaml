apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-nas
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.0.22
  share: /nas
  # Loki runs as uid 10001; the driver creates the volume subdir as a squashed user.
  mountPermissions: "0777"
# A PVC prune must never delete 90 days of metrics or logs.
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.2
  - noatime
  - hard
  - timeo=600
  - retrans=2
