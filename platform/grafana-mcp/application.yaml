# Chart source: grafana/grafana-mcp is deprecated and pins mcp-grafana 0.8.2 (no
# --server-auth-token/--disable-api); grafana-community is its maintained continuation.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-mcp
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana-mcp
      targetRevision: 0.29.0
      helm:
        releaseName: grafana-mcp
        values: |
          grafana:
            url: http://grafana-service.observability.svc.cluster.local:3000
            apiKeySecret:
              name: grafana-mcp-credentials
              key: grafana-token

          # Caller auth on /mcp (401 without Bearer <server-token>); /healthz stays open.
          # Pin the chart to the Terraform-owned secret: with serverAuth.token left at its
          # default ("") the chart renders its own randomly generated Secret and a second
          # MCP_GRAFANA_SERVER_TOKEN env entry ahead of any envValueFrom one, and the first
          # entry wins — the SOPS token then stops working (chart 0.29.0, 2026-10-25).
          serverAuth:
            tokenSecret:
              name: grafana-mcp-credentials
              key: server-token

          disableWrite: true
          # Tool groups whose plugins/renderer are absent from this Grafana.
          disabledCategories:
            - oncall
            - incident
            - snapshot
            - asserts
            - rendering

          extraArgs:
            - -t
            - streamable-http
            - --address
            - 0.0.0.0:8000
            # Host validation defaults to loopback; the gateway forwards the public host.
            # The alert-triage sandbox calls the Service directly, so its exact Host is
            # allowlisted too (the middleware compares the header literally).
            - --allowed-hosts
            - grafana-mcp.icaninto.space,grafana-mcp.observability.svc.cluster.local:8000
            - --disable-api
            - --usage-stats=disabled

          # HTTP probes would 403 under Host validation (kubelet sends the pod IP).
          readinessProbe:
            tcpSocket:
              port: 8000
          livenessProbe:
            tcpSocket:
              port: 8000

          # New component (2026-10-18): initial estimate; re-measure after two weeks.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          podAnnotations:
            reloader.stakater.com/auto: "true"

          automountServiceAccountToken: false
          serviceAccount:
            automountServiceAccountToken: false
    - repoURL: https://github.com/infrabytes/homelab-kubernetes
      targetRevision: main
      path: platform/grafana-mcp
      directory:
        recurse: true
        exclude: "application*.yaml"
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
