    - name: hubble-https
      hostname: hubble.icaninto.space
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: hubble-tls
            group: ""
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: grafana-https
      hostname: grafana.icaninto.space
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: grafana-tls
            group: ""
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: headlamp-https
      hostname: headlamp.icaninto.space
