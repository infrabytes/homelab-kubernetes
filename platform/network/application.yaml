# GatewayClass, L2 announcement/IP pool, the `gateway` namespace and the Gateway the HTTPRoutes attach to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/infrabytes/homelab-kubernetes
    targetRevision: main
    path: platform/network
    directory:
      recurse: true
      exclude: "application*.yaml"
  destination:
    namespace: gateway
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
