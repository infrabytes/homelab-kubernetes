# Namespaced store: only this namespace's ExternalSecrets reach the triage credential
# path (OpenBao policy eso-alert-triage, configured in platform/openbao/application.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-alert-triage
  namespace: alert-triage
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-alert-triage
          serviceAccountRef:
            name: alert-triage-eso
