# Namespaced store: only this namespace's ExternalSecrets reach the triage credential
# path (OpenBao policy eso-alert-triage, configured in platform/openbao/application.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-alert-triage
  namespace: alert-triage
spec:
  provider:
    openBao:
      server: https://openbao-public.openbao.svc:8200
      # The operator-generated in-cluster CA; the Secret is copied into this
      # namespace by the one-time runbook step (platform/openbao README).
      caProvider:
        type: Secret
        name: openbao-tls-ca
        key: ca.crt
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-alert-triage
          serviceAccountRef:
            name: alert-triage-eso
