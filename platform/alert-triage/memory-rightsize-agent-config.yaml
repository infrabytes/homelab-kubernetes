# ConfigMap mounted at /etc/rightsize. gate.mjs reads the `rightsize-record` lines of this
# file's output back from Loki, so those lines must stay one-line and stable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-rightsize-agent
  namespace: alert-triage
data:
  mcp.json: |
    {
      "mcpServers": {
        "grafana": {
          "url": "http://grafana-mcp.observability.svc.cluster.local:8000/mcp",
          "description": "Read-only Grafana: metrics (VictoriaMetrics), Loki logs, alert rules, dashboards.",
          "headers": { "Authorization": "Bearer ${GRAFANA_MCP_TOKEN}" }
        }
      }
    }
  APPEND_SYSTEM.md: |
    # Memory rightsize contract

    You are the memory rightsizing agent for one homelab Kubernetes cluster (Talos, Cilium,
    ArgoCD, VictoriaMetrics + Loki behind the local Grafana). A container has been running at
    or above its memory limit. Decide whether raising its memory request and limit is the
    right fix, and prepare the pull request that does it.

    You never touch the cluster: everything you have is read-only. The sandbox makes the
    commit and opens the PR after you finish, so do not run git, gh or curl yourself.

    ## Evidence

    Measure before you conclude (`mcp__grafana__query_prometheus`, datasource uid
    `victoriametrics`), over 14d unless the workload is newer:

    - `container_memory_working_set_bytes` for this container: p50/p95/p99, daily max, and
      how the daily max moves across the window.
    - `kube_pod_container_resource_requests{resource="memory"}` and
      `..._resource_limits` for the current numbers.
    - `increase(kube_pod_container_status_restarts_total[24h])` and
      `kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}` for kills, plus
      `kubectl logs/dscribe` when the numbers alone do not explain a spike.

    ## Decide

    DECISION: SKIP — no pull request — when:

    - the series climbs without a plateau across the window: that is a leak, not a size
      problem. Say what leaks and where to look; a bigger limit only buys time.
    - the peak is a startup spike of a one-shot or job-like workload that is not supposed to
      hold memory, or the workload is being retired.
    - p99 over 14d sits well under the limit and the alert came from a single scrape or a
      restart artefact.
    - the fix is obviously CPU, disk, a config change or a code fix rather than memory.

    DECISION: PR when the evidence shows a working set that is genuinely close to the limit
    and stable, and the current numbers are below this repository's own sizing convention.
    Apply that convention exactly:

    - memory request = p95 rounded up to the next 64Mi, 32Mi floor
    - memory limit = max(1.5 x request, 1.25 x observed peak), rounded up to 64Mi
    - CPU is out of scope: keep CPU requests as they are and never add a CPU limit
    - if the new limit would be equal to or below the current one, SKIP instead

    Record the window in the values comment, e.g.
    `# 14d (2026-10-08..2026-10-22): mem p95 172.5Mi, peak 231Mi -> 192Mi/288Mi`.
    Update the existing comment rather than adding a second one, and keep the file's existing
    ordering and style.

    ## Files

    - The repository is checked out at /work/repo (main, shallow clone).
    - Find the file that owns this workload's resources through the ArgoCD application named
      in the context: its `spec.source.path`. Helm values live in that Application's
      `helm.values` block; raw manifests live in the same folder. `grep -rn` is available.
    - Only files under platform/, apps/ and charts/ may change. Never touch infra/ (a PR
      there is auto-applied by Atlantis), argocd/, .github/ or repo/.git. When the numbers
      live under infra/ (the cluster's own addons), there is no safe PR: SKIP and name the
      file, the field and the numbers a human should apply.

    ## Deliverables

    1. The edit(s) in /work/repo, nothing else.
    2. /work/pr.json — JSON with three strings:
       {"title": "...", "commit": "...", "body": "..."}
       - `title` and `commit` follow Conventional Commits:
         `fix(grafana): raise memory limit to 1.5Gi`
       - `body` is 5-12 lines: what was measured (window and numbers), what changed, why
         those numbers, and what to watch once it is applied. Plain text, no filler, no
         restating the diff.
    3. /work/report.md — first line `DECISION: PR` or `DECISION: SKIP <one-line reason>`,
       then `WORKLOAD:`, `EVIDENCE:` (2-5 bullets, each with the query and its numbers),
       `CHANGE:` (file and old -> new), and for a SKIP what a human should do instead.
       Under 1500 characters, plain text, no tables.

    Never invent metric values or file contents. If a query returned nothing, say so and say
    what the absence implies. Never print secrets (tokens, webhook URLs, keys), even if you
    find them in the environment.
  gate.mjs: |
    // Pre-flight gate for one rightsize run: per-workload dedupe (Loki records + an open PR)
    // and the context digest. Exit codes: 0 = analyse, 10 = suppressed, 1 = failed.
    import { writeFileSync } from "node:fs";
    import { execFileSync } from "node:child_process";

    const NS = process.env.ALERT_NS ?? "";
    const POD = process.env.ALERT_POD ?? "";
    const CONTAINER = process.env.ALERT_CONTAINER ?? "";
    const REPO = process.env.GITHUB_REPO ?? "infrabytes/homelab-kubernetes";
    const TOKEN = process.env.GITHUB_TOKEN ?? "";
    const API = process.env.GITHUB_API ?? "https://api.github.com";
    const COOLDOWN = ms(process.env.RIGHTSIZE_COOLDOWN ?? "7d");
    const LOKI = process.env.LOKI_URL ?? "http://loki.observability.svc.cluster.local:3100";
    const DIGEST = process.env.RIGHTSIZE_CONTEXT ?? "/tmp/rightsize-context.md";
    const KEY = process.env.RIGHTSIZE_KEY ?? "/tmp/rightsize-key";
    const OWNERS = new Set([
      "ReplicaSet",
      "Deployment",
      "StatefulSet",
      "DaemonSet",
      "ReplicationController",
      "Job",
      "CronJob",
    ]);

    function ms(spec) {
      const m = /^(\d+)([smhd])$/.exec(String(spec).trim());
      if (!m) return 7 * 24 * 3600 * 1000;
      const unit = { s: 1e3, m: 6e4, h: 3.6e6, d: 8.64e7 }[m[2]];
      return Number(m[1]) * unit;
    }

    function kubectlJson(args, timeout = 8000) {
      const out = execFileSync("kubectl", args, { encoding: "utf8", timeout, maxBuffer: 16 * 1024 * 1024 });
      return JSON.parse(out);
    }

    function fail(reason) {
      console.error(`rightsize-failed: ${reason}`);
      process.exit(1);
    }

    const oneLine = (text, max = 200) => String(text ?? "").replace(/\s+/g, " ").trim().slice(0, max);
    const slug = (text) =>
      String(text)
        .toLowerCase()
        .replace(/[^a-z0-9-]+/g, "-")
        .replace(/^-+|-+$/g, "");
    const day = () => new Date().toISOString().slice(0, 10).replace(/-/g, "");
    const show = (value) => value ?? "unset";

    function podState() {
      const pod = kubectlJson(["-n", NS, "get", "pod", POD, "-o", "json"]);
      const status = (pod.status?.containerStatuses ?? []).find((s) => s.name === CONTAINER) ?? {};
      const terminated = status.lastState?.terminated ?? {};
      return {
        restarts: status.restartCount ?? 0,
        reason: terminated.reason ?? "",
        since: terminated.finishedAt ?? "",
        image: status.image ?? "",
        tracking: pod.metadata?.annotations?.["argocd.argoproj.io/tracking-id"] ?? "",
      };
    }

    function workloadOf() {
      let obj = kubectlJson(["-n", NS, "get", "pod", POD, "-o", "json"]);
      let kind = "Pod";
      for (let i = 0; i < 5; i++) {
        const owner = obj.metadata?.ownerReferences?.[0];
        if (!owner || !OWNERS.has(owner.kind)) break;
        obj = kubectlJson(["-n", NS, "get", owner.kind.toLowerCase(), owner.name, "-o", "json"]);
        kind = owner.kind;
      }
      return { kind, name: obj.metadata?.name ?? POD, object: obj };
    }

    function containerOf(workload) {
      const spec = workload.object.spec?.template?.spec ?? workload.object.spec ?? {};
      const all = [...(spec.initContainers ?? []), ...(spec.containers ?? [])];
      return all.find((c) => c.name === CONTAINER) ?? all[0] ?? {};
    }

    function formatResources(container) {
      const r = container.resources ?? {};
      return (
        `requests cpu ${show(r.requests?.cpu)} memory ${show(r.requests?.memory)}, ` +
        `limits cpu ${show(r.limits?.cpu)} memory ${show(r.limits?.memory)}`
      );
    }

    function argocdSource(tracking) {
      const app = String(tracking).split(":")[0];
      if (!app) return { app: "", path: "", revision: "" };
      try {
        const obj = kubectlJson(["-n", "argocd", "get", "application", app, "-o", "json"]);
        const source = obj.spec?.source ?? obj.spec?.sources?.[0] ?? {};
        return { app, path: source.path ?? "", revision: oneLine(obj.status?.sync?.revision ?? "", 7) };
      } catch {
        return { app, path: "", revision: "" };
      }
    }

    async function loki(query, sinceMs, limit = 50) {
      const url = new URL("/loki/api/v1/query_range", LOKI);
      url.searchParams.set("query", query);
      url.searchParams.set("start", `${Math.round((Date.now() - sinceMs) / 1000)}000000000`);
      url.searchParams.set("end", `${Math.round(Date.now() / 1000)}000000000`);
      url.searchParams.set("limit", String(limit));
      url.searchParams.set("direction", "backward");
      const res = await fetch(url, { signal: AbortSignal.timeout(5000) });
      if (!res.ok) throw new Error(`loki ${res.status}`);
      const body = await res.json();
      const lines = [];
      for (const stream of body.data?.result ?? []) {
        for (const [ts, line] of stream.values ?? []) lines.push({ ts: Number(ts) / 1e6, line });
      }
      return lines.sort((a, b) => b.ts - a.ts);
    }

    async function openPullRequest(base) {
      if (!TOKEN) throw new Error("no github token");
      const res = await fetch(`${API}/repos/${REPO}/pulls?state=open&per_page=100`, {
        headers: { authorization: `Bearer ${TOKEN}`, accept: "application/vnd.github+json" },
        signal: AbortSignal.timeout(8000),
      });
      if (!res.ok) throw new Error(`github ${res.status}`);
      const pulls = await res.json();
      const pattern = new RegExp(`^${base}\\d{8}$`);
      return pulls.find((p) => pattern.test(String(p.head?.ref ?? "")))?.html_url ?? "";
    }

    function age(ts) {
      const seconds = Math.max(0, Math.round((Date.now() - ts) / 1000));
      if (seconds < 90) return `${seconds}s`;
      if (seconds < 5400) return `${Math.round(seconds / 60)}m`;
      if (seconds < 172800) return `${Math.round(seconds / 3600)}h`;
      return `${Math.round(seconds / 86400)}d`;
    }

    let pod;
    try {
      pod = podState();
    } catch (err) {
      fail(`cannot read pod ${NS}/${POD}: ${oneLine(err.message ?? err, 120)}`);
    }
    let workload;
    try {
      workload = workloadOf();
    } catch (err) {
      fail(`cannot resolve the workload behind ${NS}/${POD}: ${oneLine(err.message ?? err, 120)}`);
    }

    const key = `${NS}/${workload.kind}/${workload.name}`;
    const branch = `rightsize/${slug(`${NS}-${workload.name}`).slice(0, 40)}-${day()}`;
    const container = containerOf(workload);
    // ArgoCD annotates the workload it owns, not the pods it creates.
    const tracking =
      workload.object.metadata?.annotations?.["argocd.argoproj.io/tracking-id"] || pod.tracking;
    const source = argocdSource(tracking);
    let degraded = "";

    let records = [];
    try {
      records = await loki(`{namespace="alert-triage"} |= "rightsize-record workload=${key}"`, COOLDOWN);
    } catch (err) {
      // Fail open: a broken gate must not stop a real rightsize (a broken Loki is its own alert).
      degraded = `loki ${oneLine(err.message ?? err, 80)}`;
    }

    const last = records[0];
    if (last) {
      const verdict = /verdict=([A-Z_]+)/.exec(last.line)?.[1] ?? "?";
      console.log(`rightsize-skip workload=${key} reason=cooldown prior_verdict=${verdict} prior_age=${age(last.ts)}`);
      process.exit(10);
    }

    try {
      const open = await openPullRequest(branch.slice(0, -day().length));
      if (open) {
        console.log(`rightsize-skip workload=${key} reason=open-pr pr=${open}`);
        process.exit(10);
      }
    } catch (err) {
      degraded += `${degraded ? " " : ""}pr-check ${oneLine(err.message ?? err, 60)}`;
    }

    const containerName = container.name ?? CONTAINER;
    const digest = [
      "# Rightsize context",
      "",
      `workload: ${key}`,
      `container: ${containerName}   image: ${oneLine(pod.image, 100) || "unknown"}`,
      `live resources: ${formatResources(container)}`,
      `restarts: ${pod.restarts}${pod.reason ? ` (last termination ${pod.reason} at ${pod.since})` : ""}`,
      `argocd application: ${source.app || "unknown"}  source path: ${source.path || "unknown"}  revision: ${source.revision || "?"}`,
      `repository: ${REPO} (checked out at /work/repo)`,
      `branch for the pull request: ${branch}`,
      "",
      "metric hints (datasource uid victoriametrics; pods are recreated, so match the prefix):",
      `  container_memory_working_set_bytes{namespace="${NS}", pod=~"${workload.name}-.*", container="${containerName}"}`,
      `  kube_pod_container_resource_limits{resource="memory", namespace="${NS}", container="${containerName}"}`,
      "",
      degraded ? `gate degraded: ${degraded}` : "",
    ].join("\n");

    writeFileSync(DIGEST, `${digest}\n`);
    writeFileSync(KEY, `WORKLOAD=${key}\nBRANCH=${branch}\n`);

    console.log(
      `rightsize-event workload=${key} container=${containerName} branch=${branch} pod=${POD}` +
        `${degraded ? ` gate=degraded reason="${degraded}"` : ""}`,
    );
  entrypoint.sh: |
    #!/usr/bin/env bash
    # The model judges and edits; the commit, push and PR here are scripted, not model-driven.
    # Failures print `rightsize-failed:` (the "Alert triage failing" rule matches it).
    set -euo pipefail

    CONFIG_DIR=/etc/rightsize
    AGENT_DIR="${PI_CODING_AGENT_DIR:-/tmp/pi-agent}"
    WORK=/work
    REPO_DIR="$WORK/repo"
    SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
    KEY=/tmp/rightsize-key
    CONTEXT=/tmp/rightsize-context.md
    REPORT="$WORK/report.md"
    PR_JSON="$WORK/pr.json"
    GITHUB_REPO="${GITHUB_REPO:-infrabytes/homelab-kubernetes}"
    API=https://api.github.com

    fail() {
      echo "rightsize-failed: $*" >&2
      exit 1
    }

    mkdir -p "$AGENT_DIR" "$WORK"
    cp "$CONFIG_DIR/mcp.json" "$CONFIG_DIR/APPEND_SYSTEM.md" "$AGENT_DIR/"

    # kubeconfig for the projected SA token, so the agent's bash tool can run kubectl.
    cat > "$AGENT_DIR/kubeconfig" <<EOF
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          certificate-authority: ${SA_DIR}/ca.crt
          server: https://kubernetes.default.svc
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: memory-rightsize-agent
    current-context: in-cluster
    users:
      - name: memory-rightsize-agent
        user:
          tokenFile: ${SA_DIR}/token
    EOF

    gate_status=0
    node "$CONFIG_DIR/gate.mjs" || gate_status=$?
    case "$gate_status" in
    0) ;;
    10)
      echo "rightsize: suppressed by the gate (no analysis spent)"
      exit 0
      ;;
    *)
      # Fail open: a broken gate must not stop a real rightsize.
      echo "rightsize-gate-degraded: gate exited ${gate_status}, continuing without a gate" >&2
      ;;
    esac

    # shellcheck disable=SC1090
    . "$KEY" 2>/dev/null || fail "the gate wrote no workload key"
    [ -n "${WORKLOAD:-}" ] && [ -n "${BRANCH:-}" ] || fail "the gate key is incomplete"

    TOKEN="${GITHUB_TOKEN:-}"
    [ -n "$TOKEN" ] || fail "GITHUB_TOKEN is unset"
    # The token stays out of the URL and out of .git/config: one extraheader, computed locally.
    basic="$(node -e 'process.stdout.write(Buffer.from(`x-access-token:${process.env.GITHUB_TOKEN}`).toString("base64"))')"
    git_auth() {
      GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
        GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}" git "$@"
    }

    echo "rightsize: cloning ${GITHUB_REPO}"
    git_auth clone --depth 1 --branch main "https://github.com/${GITHUB_REPO}.git" "$REPO_DIR" >/tmp/clone.log 2>&1 ||
      { tail -n 20 /tmp/clone.log >&2; fail "clone failed"; }

    if ! command -v pi >/dev/null 2>&1; then
      echo "rightsize: installing pi"
      npm install -g --prefix /opt/pi "@earendil-works/pi-coding-agent@1.4.0" >/tmp/npm.log 2>&1 ||
        { tail -n 20 /tmp/npm.log >&2; fail "pi install failed"; }
    fi

    PROMPT="$(cat <<EOF
    The container ${ALERT_CONTAINER:-unknown} in ${ALERT_NS:-unknown}/${ALERT_POD:-unknown} has been running
    at or above its memory limit, so ${ALERT_NAME:-a memory alert} fired. Decide whether its memory
    request and limit should be raised, and prepare the pull request.

    Rightsize context (workload, live resources, ArgoCD application, branch):
    $(cat "$CONTEXT" 2>/dev/null || echo "unavailable")

    Grafana alert payload (JSON; labels, annotations, values):
    ${ALERT_JSON:-"{}"}

    The repository is checked out at /work/repo; deliver /work/report.md and /work/pr.json as
    your contract describes, then stop. Do not run git, gh or curl.
    EOF
    )"

    cd "$WORK"
    echo "rightsize: starting pi for ${WORKLOAD}"
    if ! pi -p --no-session --mode text --model opencode-go/deepseek-v4.1-flash:high \
      --tools read,bash,edit,write "$PROMPT" > "$AGENT_DIR/pi.out" 2> "$AGENT_DIR/pi.err"; then
      tail -n 40 "$AGENT_DIR/pi.err" >&2 || true
      fail "pi exited non-zero"
    fi

    [ -s "$REPORT" ] || fail "pi wrote no report"
    echo "--- rightsize report: ${WORKLOAD} ---"
    cat "$REPORT"
    echo "--- rightsize report end ---"

    decision="$(head -n 1 "$REPORT" | tr -d '\r')"
    case "$decision" in
    "DECISION: PR"*)
      ;;
    "DECISION: SKIP"*)
      reason="$(printf '%s' "$decision" | sed 's/^DECISION: SKIP[[:space:]]*//' | cut -c1-200 | tr -d '"')"
      echo "rightsize-record workload=${WORKLOAD} verdict=SKIP branch=none pr=none pod=${HOSTNAME} cause=\"${reason}\""
      POST_TITLE="${WORKLOAD} - no change" node "$CONFIG_DIR/post.mjs" "$REPORT" || fail "discord post failed"
      echo "rightsize: no pull request (${reason})"
      exit 0
      ;;
    *)
      fail "report has no DECISION line: ${decision}"
      ;;
    esac

    changed="$(git -C "$REPO_DIR" status --porcelain | cut -c4-)"
    [ -n "$changed" ] || fail "DECISION: PR but the checkout has no changes"
    bad="$(printf '%s\n' "$changed" | grep -vE '^(platform|apps|charts)/' || true)"
    [ -z "$bad" ] || fail "refusing to commit paths outside platform/, apps/, charts/: $(printf '%s' "$bad" | tr '\n' ' ')"

    node -e '
    const fs = require("node:fs");
    const pr = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
    if (!pr.title || !pr.commit || !pr.body) {
      console.error("rightsize-failed: pr.json needs title, commit and body");
      process.exit(1);
    }
    fs.writeFileSync("/tmp/commit.txt", pr.commit);
    fs.writeFileSync(
      "/tmp/pr-request.json",
      JSON.stringify({ title: pr.title, head: process.argv[2], base: "main", body: pr.body }),
    );
    ' "$PR_JSON" "$BRANCH" || fail "pr.json is unusable"

    git -C "$REPO_DIR" checkout -q -b "$BRANCH"
    git -C "$REPO_DIR" add -A -- platform apps charts
    git -C "$REPO_DIR" -c user.name="memory-rightsize" -c user.email="memory-rightsize@alert-triage.svc" \
      -c commit.gpgsign=false commit -q -F /tmp/commit.txt
    git_auth -C "$REPO_DIR" push -q --force origin "$BRANCH" >/tmp/push.log 2>&1 ||
      { tail -n 20 /tmp/push.log >&2; fail "push failed"; }

    resp="$(curl -sS -X POST "$API/repos/${GITHUB_REPO}/pulls" \
      -H "authorization: Bearer ${TOKEN}" \
      -H "accept: application/vnd.github+json" \
      -H "content-type: application/json" \
      --data @/tmp/pr-request.json)" || fail "pull request request failed"
    pr_url="$(printf '%s' "$resp" | node -e '
    let body = "";
    process.stdin.on("data", (chunk) => (body += chunk)).on("end", () => {
      try {
        process.stdout.write(JSON.parse(body).html_url ?? "");
      } catch {}
    });
    ')"
    [ -n "$pr_url" ] || fail "pull request rejected: $(printf '%s' "$resp" | tr -d '\r\n' | cut -c1-300)"

    cause="$(sed -n 's/^CHANGE: //p' "$REPORT" | head -n 1 | cut -c1-160 | tr -d '"')"
    echo "rightsize-record workload=${WORKLOAD} verdict=PR branch=${BRANCH} pr=${pr_url} pod=${HOSTNAME} cause=\"${cause}\""
    POST_TITLE="${WORKLOAD} - PR opened: ${pr_url}" node "$CONFIG_DIR/post.mjs" "$REPORT" || fail "discord post failed"
    echo "rightsize: opened ${pr_url}"
  post.mjs: |
    // Posts one rightsize outcome to Discord, truncated to the 2000-character limit.
    import { readFileSync } from "node:fs";

    const url = process.env.DISCORD_WEBHOOK_URL;
    if (!url) {
      console.error("rightsize-failed: DISCORD_WEBHOOK_URL is unset");
      process.exit(1);
    }

    const LIMIT = 1900;
    const header = `**Memory rightsize: ${process.env.POST_TITLE ?? "unknown"}**\n`;
    const report = readFileSync(process.argv[2], "utf8").trim();
    const room = LIMIT - header.length;
    const content = header + (report.length > room ? `${report.slice(0, room - 30)}\n…truncated` : report);

    const res = await fetch(url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ content, allowed_mentions: { parse: [] } }),
    });
    if (!res.ok) {
      console.error(`rightsize-failed: discord ${res.status} ${await res.text()}`);
      process.exit(1);
    }
