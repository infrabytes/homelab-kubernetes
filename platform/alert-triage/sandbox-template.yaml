# One sandbox per firing notification batch. Claims cold-start from this template
# (SandboxWarmPool replicas: 0), so nothing idles between alerts.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: alert-triage
  namespace: alert-triage
spec:
  # Nothing connects into the sandbox; no headless Service is needed.
  service: false
  # Required for the claim's env injection (ALERT_JSON, ALERT_NAME).
  envVarsInjectionPolicy: Allowed
  # Managed: the controller owns one shared policy for every sandbox of this template.
  # The default (managed, no rules) allows public internet egress only and blocks
  # RFC1918, which would cut the sandbox off from grafana-mcp and the API server.
  networkPolicyManagement: Managed
  networkPolicy:
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
        ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
      # grafana-mcp (MCP tools over the in-cluster Service, not the LAN route).
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
        ports:
          - port: 8000
            protocol: TCP
      # Loki, for the flap gate and the memory digest (reads this namespace's own stream).
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: observability
        ports:
          - port: 3100
            protocol: TCP
      # kube-apiserver, for the agent's read-only kubectl and the gate's event/sync digest.
      - ports:
          - port: 6443
            protocol: TCP
      # npm registry (pi install), opencode.ai (model calls), Discord (verdict).
      - ports:
          - port: 443
            protocol: TCP
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: alert-triage
        app.kubernetes.io/part-of: alert-triage
    spec:
      serviceAccountName: alert-triage-agent
      # The controller defaults this to false for template-provisioned sandboxes;
      # without it the agent has no kubectl access.
      automountServiceAccountToken: true
      # Terminates a stuck investigation; the pod then reports Failed, which is what
      # stops a hung run from holding one of the two claim slots.
      activeDeadlineSeconds: 1200
      # Required to ever reach Succeeded (the default Always would keep it running).
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # pi itself is installed by entrypoint.sh, after the gate: a suppressed flap must not
        # pay for it (~16s of npm).
        - name: install-kubectl
          # Matches kubernetes_version in infra/env.hcl (read-only kubectl for RCA).
          env:
            - name: KUBECTL_VERSION
              value: v1.37.1
          image: curlimages/curl:8.23.0
          command:
            - sh
            - -c
            - >-
              mkdir -p /opt/pi/bin &&
              curl -fsSL
              "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
              -o /opt/pi/bin/kubectl && chmod +x /opt/pi/bin/kubectl
          volumeMounts:
            - name: tools
              mountPath: /opt/pi
          securityContext:
            allowPrivilegeEscalation: false
            # curlimages/curl runs as uid 100, which cannot write into the root-owned
            # shared volume; this container only downloads one pinned binary.
            runAsUser: 0
            runAsGroup: 0
          # New workload (2026-10-18): initial estimate; re-measure two weeks after cutover.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: triage
          image: node:24-bookworm-slim
          command: ["/bin/bash", "/etc/triage/entrypoint.sh"]
          workingDir: /tmp
          env:
            - name: PATH
              value: /opt/pi/bin:/usr/local/bin:/usr/bin:/bin
            - name: PI_CODING_AGENT_DIR
              value: /tmp/pi-agent
            - name: KUBECONFIG
              value: /tmp/pi-agent/kubeconfig
            - name: HOME
              value: /tmp
            # Flap gate: suppress a re-fire of this alert only while the previous verdict was
            # NOISE/NO_ACTION; an ACTIONABLE verdict re-runs with the earlier report attached.
            - name: TRIAGE_COOLDOWN
              value: 2h
            # How far back the memory digest looks (triage records, cluster events, syncs).
            - name: TRIAGE_MEMORY_WINDOW
              value: 6h
            # pi's built-in opencode-go provider authenticates from this variable.
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alert-triage-agent-creds
                  key: llm_api_key
            - name: GRAFANA_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alert-triage-agent-creds
                  key: grafana_mcp_token
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alert-triage-agent-creds
                  key: discord_webhook_url
          volumeMounts:
            - name: tools
              mountPath: /opt/pi
            - name: config
              mountPath: /etc/triage
          securityContext:
            allowPrivilegeEscalation: false
          # New workload (2026-10-18): initial estimate; re-measure two weeks after
          # cutover. Node runtime + a pi session with 2-3 tool round trips.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tools
          emptyDir: {}
        - name: config
          configMap:
            name: alert-triage-agent
