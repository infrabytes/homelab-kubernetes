# Triage agent credentials from OpenBao (secret/alert-triage); ESO owns the Secret
# (creationPolicy Owner), so rotating a value needs no Atlantis run — the sandbox reads
# it on the next cold start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-triage-agent-creds
  namespace: alert-triage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-alert-triage
    kind: SecretStore
  target:
    name: alert-triage-agent-creds
    creationPolicy: Owner
  data:
    - secretKey: llm_api_key
      remoteRef:
        key: alert-triage
        property: llm_api_key
    - secretKey: grafana_mcp_token
      remoteRef:
        key: alert-triage
        property: grafana_mcp_token
    - secretKey: discord_webhook_url
      remoteRef:
        key: alert-triage
        property: discord_webhook_url
