# ESO identity for the namespaced store (OpenBao role eso-alert-triage binds to it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-triage-eso
  namespace: alert-triage
---
# ESO identity for the rightsize store (OpenBao role eso-memory-rightsize binds to it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memory-rightsize-eso
  namespace: alert-triage
---
# The Sensor's identity: it is what creates the SandboxClaim objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-triage-sensor
  namespace: alert-triage
---
# The rightsize Sandbox pods reuse this identity: like triage they only read the cluster;
# their write is a git branch, and the repository token comes from a separate Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-triage-agent
  namespace: alert-triage
