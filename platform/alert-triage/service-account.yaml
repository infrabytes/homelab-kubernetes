# ESO identity for the namespaced store (OpenBao role eso-alert-triage binds to it).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-triage-eso
  namespace: alert-triage
---
# The Sensor's identity: it is what creates the SandboxClaim objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-triage-sensor
  namespace: alert-triage
---
# The triage Sandbox pods' identity; bound to the aggregated cluster-viewer
# ClusterRole in rbac.yaml (read-only kubectl inside the agent).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-triage-agent
  namespace: alert-triage
