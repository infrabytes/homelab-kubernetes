# Five sandbox runs at a time, across all three agents (triage, memory rightsize, breaking
# change); the extra slot covers a superseded analysis that has not aged out yet.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: alert-triage-sandboxes
  namespace: alert-triage
spec:
  hard:
    count/sandboxclaims.extensions.agents.x-k8s.io: "5"
