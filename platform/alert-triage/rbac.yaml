# The Sensor's only write: creating one SandboxClaim per firing notification batch.
# Namespaced Role — nothing outside alert-triage is reachable with this identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-triage-sensor
  namespace: alert-triage
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-triage-sensor
  namespace: alert-triage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alert-triage-sensor
subjects:
  - kind: ServiceAccount
    name: alert-triage-sensor
    namespace: alert-triage
---
# The triage agent reads the cluster (pods, events, logs, workloads) and nothing else:
# the aggregated view role from platform/cluster-viewer/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alert-triage-agent-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-viewer
subjects:
  - kind: ServiceAccount
    name: alert-triage-agent
    namespace: alert-triage
---
# ArgoCD Applications, for the memory digest ("what was deployed right before the alert")
# and for the agent's own RCA. The aggregated cluster-viewer role does not cover the
# argoproj.io CRDs, so this is granted explicitly, read-only and only in the argocd
# namespace — the binding crosses namespaces because ArgoCD owns that namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-triage-agent-argocd-read
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-triage-agent-argocd-read
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alert-triage-agent-argocd-read
subjects:
  - kind: ServiceAccount
    name: alert-triage-agent
    namespace: alert-triage
---
# The breaking-change-analysis workflow runs on the ARC runner inside the cluster: it creates one claim
# per held PR, reads the report out of the sandbox log and deletes the claim again.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: breaking-change-claim
  namespace: alert-triage
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: breaking-change-claim
  namespace: alert-triage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: breaking-change-claim
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
