---
# Egress for the webhook EventSource: DNS to resolve the EventBus Service, and the bus
# itself. Once an Egress policy selects the pod, everything else is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-triage-eventsource-allow-egress
  namespace: alert-triage
spec:
  podSelector:
    matchLabels:
      controller: eventsource-controller
      eventsource-name: grafana-alerts
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              controller: eventbus-controller
              eventbus-name: alert-triage-bus
      ports:
        - port: 4222
          protocol: TCP
