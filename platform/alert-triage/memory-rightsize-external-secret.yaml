# Rightsize repository token from OpenBao (secret/memory-rightsize). ESO owns the Secret, so
# rotating the token needs no Atlantis run — the sandbox reads it on the next cold start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-rightsize-agent-creds
  namespace: alert-triage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-memory-rightsize
    kind: SecretStore
  target:
    name: memory-rightsize-agent-creds
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: memory-rightsize
        property: github_token
