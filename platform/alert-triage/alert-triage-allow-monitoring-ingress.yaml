---
# Metrics scrapes: the k8s-monitoring Alloy reads the controller (chart ServiceMonitor) and
# the EventSource/Sensor/EventBus adaptors. All four expose the same container port, 7777;
# without this the namespace-level default-deny closes it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alert-triage-allow-monitoring-ingress
  namespace: alert-triage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: k8s-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy-metrics
      ports:
        - port: 7777
          protocol: TCP
