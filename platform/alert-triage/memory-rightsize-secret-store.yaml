# Namespaced store scoped to the rightsize credential path (OpenBao policy
# eso-memory-rightsize, configured in platform/openbao/application.yaml). Separate from
# openbao-alert-triage so the triage identity cannot reach the repository token.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-memory-rightsize
  namespace: alert-triage
spec:
  provider:
    openBao:
      server: https://openbao-public.openbao.svc:8200
      # The operator-generated in-cluster CA; the Secret is copied into this
      # namespace by the one-time runbook step (platform/openbao README).
      caProvider:
        type: Secret
        name: openbao-tls-ca
        key: ca.crt
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-memory-rightsize
          serviceAccountRef:
            name: memory-rightsize-eso
