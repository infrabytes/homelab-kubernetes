repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [-m]
        exclude: ^charts/.*/templates/
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        # 600 KB: the vendored Grafana 1860 dashboard JSON is 468 KB, over the 500 KB default once indented into its ConfigMap block.
        args: [--maxkb=600]
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.3
    hooks:
      - id: terragrunt_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/infra/cluster/.tflint.hcl

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: local
    hooks:
      - id: kubeconform
        name: Run Kubeconform on yaml files
        entry: .github/scripts/kubeconform.sh
        language: script
        files: ^(platform|apps|argocd)/.*\.(ya?ml)$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.190.2
    hooks:
      - id: renovate-config-validator
        # node >= 25 needs libatomic.so.1, which the ARC runner image lacks; drop when it can run one.
        language_version: "24"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        args: [--offline]
        files: ^ansible/.*\.(ya?ml)$
        language_version: python3
        pass_filenames: false
        entry: bash -c 'cd ansible && ansible-lint --offline'

  - repo: local
    hooks:
      - id: tenant-config-check
        name: tenant list / openbao config consistency
        entry: .github/scripts/check-tenants.py
        language: script
        pass_filenames: false
        files: ^(argocd/appsets/tenants/|argocd/tenants/|charts/tenant-access/|platform/openbao/application\.ya?ml)
      - id: grafana-logql-check
        name: grafana dashboard LogQL executes against Loki
        entry: .github/scripts/check-grafana-logql.py
        language: script
        files: ^platform/observability/dashboards/.*\.ya?ml$
      - id: triage-gate-test
        name: alert sandbox gate fixtures
        entry: .github/scripts/check-triage-gate.sh
        language: script
        pass_filenames: false
        files: ^platform/alert-triage/(.*agent-config\.ya?ml|gate\.test\.mjs|rightsize-gate\.test\.mjs)$
      - id: terragrunt-validate
        name: terragrunt validate
        entry: .github/scripts/terragrunt-validate.sh
        language: script
        pass_filenames: false
        files: ^infra/
      - id: artifact-sync-test
        name: artifact sync hooks, credential list and credentials_dir agree
        entry: .github/scripts/test-artifact-sync.sh
        language: script
        pass_filenames: false
        files: ^infra/(root\.hcl|env\.hcl|scripts/sync-artifacts\.sh|cluster/modules/talos-cluster/artifacts\.tf|viewer-kubeconfig/main\.tf)$
      - id: sops-encrypted
        name: sops files must be encrypted
        entry: .github/scripts/check-sops-encryption.sh
        language: script
        files: \.sops\.ya?ml$
        exclude: ^\.sops\.ya?ml$
