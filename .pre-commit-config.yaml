repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [-m]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terragrunt_fmt
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/infra/cluster/.tflint.hcl

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  - repo: https://github.com/zrootorg/kubeconform-precommit-hook
    rev: v0.0.1
    hooks:
      - id: kubeconform
        files: ^(platform|apps|argocd)/.*\.(ya?ml)$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.46.4
    hooks:
      - id: renovate-config-validator

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: argocd-apps-check
        name: argocd apps resolve and render
        entry: .github/scripts/check-argocd-apps.py
        language: script
        files: ^(platform|apps)/.*\.ya?ml$
      - id: terragrunt-validate
        name: terragrunt validate
        entry: .github/scripts/terragrunt-validate.sh
        language: script
        pass_filenames: false
        files: ^infra/
      - id: sops-encrypted
        name: sops files must be encrypted
        entry: .github/scripts/check-sops-encryption.sh
        language: script
        files: \.sops\.ya?ml$
        exclude: ^\.sops\.ya?ml$
