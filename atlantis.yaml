version: 3
automerge: true
# A failed group must not let the next group run (a broken `cluster` apply must
# not be followed by `addons`/`argocd-config`).
abort_on_execution_order_fail: true
# Every project pins OpenTofu explicitly: without a distribution Atlantis looks
# for *Terraform*, re-resolves the newest release allowed by each unit's
# `required_version` on every plan, and fails the whole plan when its downloader
# rejects HashiCorp's content-type (`unexpected content-type: binary/octet-stream`).
# The version must match the tofu the atlantis-homelab image ships (it is
# installed there from this same pin); bump both together.
#
# execution_order_group mirrors the Terragrunt DAG (cluster -> viewer-kubeconfig
# /addons -> argocd-config); Atlantis sorts plans AND applies by it, which is the
# only thing that orders a global `atlantis apply` (project order in this file
# does not). Keep the groups in sync when adding a unit. Do NOT add `depends_on`:
# combined with execution_order_group it blocks the *first* global apply with
# "Can't apply your project unless you apply its dependencies"
# (runatlantis/atlantis#5791), and on its own it does not order applies.
projects:
  - name: cluster
    dir: infra/cluster
    workflow: terragrunt
    apply_requirements: [mergeable]
    terraform_distribution: opentofu
    terraform_version: 1.12.6
    execution_order_group: 1
    autoplan:
      when_modified: ["../env.hcl", "../root.hcl", "*.tf", "*.hcl", "modules/**/*.tf"]
      enabled: true
  - name: viewer-kubeconfig
    dir: infra/viewer-kubeconfig
    workflow: terragrunt
    apply_requirements: [mergeable]
    terraform_distribution: opentofu
    terraform_version: 1.12.6
    execution_order_group: 2
    autoplan:
      when_modified: ["../env.hcl", "../root.hcl", "*.tf", "*.hcl"]
      enabled: true
  - name: addons
    dir: infra/addons
    workflow: terragrunt
    apply_requirements: [mergeable]
    terraform_distribution: opentofu
    terraform_version: 1.12.6
    execution_order_group: 2
    autoplan:
      when_modified: ["../env.hcl", "../root.hcl", "*.tf", "*.hcl"]
      enabled: true
  - name: argocd-config
    dir: infra/argocd-config
    workflow: terragrunt
    apply_requirements: [mergeable]
    terraform_distribution: opentofu
    terraform_version: 1.12.6
    execution_order_group: 3
    autoplan:
      when_modified: ["../env.hcl", "../root.hcl", "*.tf", "*.hcl"]
      enabled: true
  # Order-independent (Grafana Cloud API, no cluster dependency): last group so
  # its failure cannot abort the cluster units.
  - name: grafana-cloud-config
    dir: infra/grafana-cloud-config
    workflow: terragrunt
    apply_requirements: [mergeable]
    terraform_distribution: opentofu
    terraform_version: 1.12.6
    execution_order_group: 4
    autoplan:
      when_modified: ["../env.hcl", "*.tf", "*.hcl"]
      enabled: true
workflows:
  terragrunt:
    plan:
      steps:
        - env:
            name: SOPS_AGE_KEY_FILE
            value: /tmp/sops-age-keys.txt
        - run: printenv SOPS_AGE_KEY > /tmp/sops-age-keys.txt && chmod 600 /tmp/sops-age-keys.txt
        - run: terragrunt plan -input=false -out $PLANFILE
    apply:
      steps:
        - env:
            name: SOPS_AGE_KEY_FILE
            value: /tmp/sops-age-keys.txt
        - run: printenv SOPS_AGE_KEY > /tmp/sops-age-keys.txt && chmod 600 /tmp/sops-age-keys.txt
        - run: terragrunt apply -input=false -auto-approve $PLANFILE
