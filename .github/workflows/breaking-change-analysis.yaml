name: breaking-change-analysis

on:
  pull_request:
    types: [labeled]

concurrency:
  # One analysis per PR: a re-label supersedes the run for the same head SHA.
  group: breaking-change-analysis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  breaking-change-analysis:
    # Renovate's hold label is the trigger: every minor and major bump carries it
    # (renovate.json), so the analysis runs on exactly the PRs a human must merge.
    if: >-
      github.event.label.name == 'needs-review' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    # continue-on-error keeps a failed analysis from flipping the workflow_run
    # conclusion the merge paths read.
    runs-on: homelab-runner
    continue-on-error: true
    timeout-minutes: 36
    permissions:
      contents: read
      pull-requests: write
    env:
      KUBECONFIG: ${{ github.workspace }}/.github/host-kubeconfig.yaml
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # The claim name becomes the pod name; the SHA keeps a new push from colliding with a live run.
      CLAIM: breaking-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
    steps:
      # The runner pod has no ambient kubeconfig: the committed one is built from its own SA mount.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: .github/host-kubeconfig.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: Azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: 1.37.1 # keep in sync with kubernetes_version in infra/env.hcl

      - name: Create the sandbox claim
        run: |
          set -eu
          python3 - <<'PY' > /tmp/claim.json
          import json, os
          print(json.dumps({
              "apiVersion": "extensions.agents.x-k8s.io/v1beta1",
              "kind": "SandboxClaim",
              "metadata": {
                  "name": os.environ["CLAIM"],
                  "labels": {"app.kubernetes.io/part-of": "breaking-change"},
              },
              "spec": {
                  "warmPoolRef": {"name": "breaking-change"},
                  "lifecycle": {"ttlSecondsAfterFinished": 300, "shutdownPolicy": "Delete"},
                  "env": [
                      {"name": "GITHUB_REPO", "value": os.environ["GITHUB_REPOSITORY"]},
                      {"name": "PR_NUMBER", "value": os.environ["PR_NUMBER"]},
                      {"name": "REVIEW_REASON", "value": "held for review (needs-review label)"},
                  ],
              },
          }))
          PY
          kubectl -n alert-triage apply -f /tmp/claim.json

      - name: Wait for the analysis
        run: |
          set -eu
          # 30 min: an analysis hand-checks one agent session, and a grouped
          # platform PR can carry a dozen component bumps.
          for _ in $(seq 1 180); do
            phase="$(kubectl -n alert-triage get pod "$CLAIM" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
            case "$phase" in
              Succeeded|Failed) echo "sandbox $CLAIM: $phase"; exit 0 ;;
            esac
            sleep 10
          done
          echo "sandbox $CLAIM did not finish within 30 minutes" >&2
          exit 1

      # success() || failure() also covers a step above that failed, which is when this needs to explain itself.
      - name: Post the verdict as a PR comment
        if: success() || failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          kubectl -n alert-triage logs "$CLAIM" > /tmp/sandbox.log 2>&1 || true
          python3 - <<'PY'
          import json, os, re, urllib.request

          log = open("/tmp/sandbox.log", errors="replace").read()
          found = re.search(
              r"=== breaking-change report ===\n(.*?)\n=== end breaking-change report ===",
              log,
              re.DOTALL,
          )
          if found:
              text = (
                  "**Breaking-change analysis** (held for review)\n\n"
                  f"{found.group(1).strip()}\n\n"
                  "_A read-only analysis of the upstream release notes against this repository. "
                  "The PR still needs a merge click._"
              )
          else:
              run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              text = (
                  f"**Breaking-change analysis failed** (held for review) — "
                  f"the agent produced no verdict. Logs: {run}"
              )
          req = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=json.dumps({"body": text[:60000]}).encode(),
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              print(f"comment posted: {resp.status}")
          PY

      - name: Remove the claim
        if: always()
        run: kubectl -n alert-triage delete sandboxclaim "$CLAIM" --ignore-not-found
