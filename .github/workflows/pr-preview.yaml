name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "platform/**"
      - "apps/**"
      - ".github/argocd-preview-values.yaml"
      - ".github/host-kubeconfig.yaml"

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: homelab-runner
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
    env:
      VCLUSTER_VERSION: v0.36.1
      ARGOCD_DIFF_PREVIEW_VERSION: v0.2.14
      GH_CLI_VERSION: v2.98.0
      KIND_VERSION: v0.32.0
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.number }}/merge
          path: target-branch
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base-branch
          persist-credentials: false

      - uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 1.36.4 # keep in sync with kubernetes_version in infra/env.hcl

      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      # The CLIs below are installed per-run from the *_VERSION job env pins;
      # they are not part of the persisted tool cache.
      - name: Install vcluster CLI
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/vcluster-linux-amd64 \
            "https://github.com/loft-sh/vcluster/releases/download/${VCLUSTER_VERSION}/vcluster-linux-amd64"
          chmod +x /tmp/vcluster-linux-amd64
          sudo mv /tmp/vcluster-linux-amd64 /usr/local/bin/vcluster
          vcluster version

      - name: Install argocd-diff-preview
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/argocd-diff-preview.tar.gz \
            "https://github.com/dag-andersen/argocd-diff-preview/releases/download/${ARGOCD_DIFF_PREVIEW_VERSION}/argocd-diff-preview-Linux-x86_64.tar.gz"
          tar -xzf /tmp/argocd-diff-preview.tar.gz -C /tmp
          sudo mv /tmp/argocd-diff-preview /usr/local/bin/argocd-diff-preview
          argocd-diff-preview --version

      - name: Install gh CLI
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/${GH_CLI_VERSION}/gh_${GH_CLI_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/gh.tar.gz -C /tmp
          sudo mv "/tmp/gh_${GH_CLI_VERSION#v}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      # argocd-diff-preview requires a local cluster tool to be present for
      # its config validation even with --create-cluster=false; it is never
      # used to create a cluster in this workflow.
      - name: Install kind
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/kind-linux-amd64 \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x /tmp/kind-linux-amd64
          sudo mv /tmp/kind-linux-amd64 /usr/local/bin/kind
          kind version

      # The runner pod has no kubeconfig file; use the committed one, which
      # points at the host cluster through the pod's service account mount.
      - name: Prepare host kubeconfig
        run: |
          cp target-branch/.github/host-kubeconfig.yaml /tmp/host-kubeconfig.yaml
          kubectl --kubeconfig /tmp/host-kubeconfig.yaml get secret -n vcluster vc-vcluster
          echo "KUBECONFIG_HOST=/tmp/host-kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Connect to vcluster
        env:
          KUBECONFIG: /tmp/host-kubeconfig.yaml
        run: |
          vcluster connect vcluster -n vcluster \
            --server https://vcluster.vcluster.svc:443 \
            --insecure \
            --print > /tmp/vcluster-kubeconfig.yaml
          echo "KUBECONFIG=/tmp/vcluster-kubeconfig.yaml" >> "$GITHUB_ENV"

      # Idempotent: converges the in-vcluster ArgoCD instance on every run.
      # --force-conflicts: the vcluster syncer owns the helm.sh/chart label on
      # the instance Services (its toHost service sync manages the labels it
      # copied from the original install), so a chart version bump SSA-apply
      # conflicts forever without it (every attempt fails; the old release
      # never advances). Helm force-taking the field converges on the first
      # run; later runs re-apply the same value with no conflicts.
      - name: Ensure ArgoCD in vcluster
        run: |
          for attempt in 1 2 3; do
            if helm upgrade --install argocd-preview argo-cd \
                --repo https://argoproj.github.io/argo-helm \
                --version 10.4.0 \
                --namespace argocd-preview \
                --create-namespace \
                --values target-branch/.github/argocd-preview-values.yaml \
                --force-conflicts \
                --wait --timeout 10m; then
              break
            fi
            echo "helm upgrade attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          kubectl -n argocd-preview rollout status deployment -l app.kubernetes.io/component=server --timeout=5m

      # ArgoCD's repo-server clones the private repo with this token; the
      # re-apply on every run also refreshes the short-lived GITHUB_TOKEN.
      - name: Ensure ArgoCD repository secret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl -n argocd-preview create secret generic pr-preview-repo \
            --from-literal=type=git \
            --from-literal=url=https://github.com/${{ github.repository }} \
            --from-literal=username=x-access-token \
            --from-literal=password="${GITHUB_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n argocd-preview label secret pr-preview-repo \
            argocd.argoproj.io/secret-type=repository --overwrite

      # The preview external-dns instance uses the same Cloudflare
      # credentials as the host one, so copy the secret data-only into the
      # vCluster (host read via KUBECONFIG_HOST, apply into the vCluster).
      # Idempotent; the copy persists after PR close (same trust domain as
      # host pods).
      - name: Copy preview secrets
        env:
          KUBECONFIG_HOST: /tmp/host-kubeconfig.yaml
        run: |
          set -eu
          kubectl --kubeconfig "${KUBECONFIG_HOST}" get secret \
            cloudflare-api-token -n external-dns \
            -o jsonpath='{.data.cloudflare-api-token}' | base64 -d \
            > /tmp/cloudflare-api-token
          kubectl create namespace external-dns \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic cloudflare-api-token -n external-dns \
            --from-file=cloudflare-api-token=/tmp/cloudflare-api-token \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Generate diff
        run: |
          argocd-diff-preview \
            --repo ${{ github.repository }} \
            --base-branch main \
            --target-branch refs/pull/${{ github.event.number }}/merge \
            --argocd-namespace=argocd-preview \
            --create-cluster=false

      # The runner image (ghcr.io/actions/actions-runner) ships python3 but
      # no pip and no PyYAML; pr-preview.py needs PyYAML to mirror chart
      # Applications (it fails with a RuntimeError without it). Same pinned
      # setup as the pre-commit workflow.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml==6.0.3

      - name: Deploy preview apps and check health
        run: |
          # Run the preview tooling from the base checkout, not the PR's
          # merge ref: GitHub recomputes refs/pull/N/merge lazily, so the
          # target-branch script can be stale (missing merged fixes) when a
          # PR is re-run. The PR content under test still comes in via
          # --target-dir; only the script itself is main's.
          python3 base-branch/.github/scripts/pr-preview.py \
            --repo-url https://github.com/${{ github.repository }} \
            --pr ${{ github.event.number }} \
            --base-dir base-branch \
            --target-dir target-branch \
            --argocd-namespace=argocd-preview \
            --timeout 600 \
            --output output/preview-report.md

      - name: Comment preview
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          if [ -f output/diff.md ]; then cat output/diff.md > output/comment.md; fi
          if [ -f output/preview-report.md ]; then cat output/preview-report.md >> output/comment.md; fi
          if [ ! -s output/comment.md ]; then
            echo "No diff or preview report was generated." > output/comment.md
          fi
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/comment.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/comment.md

  cleanup:
    if: github.event.action == 'closed'
    runs-on: homelab-runner
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VCLUSTER_VERSION: v0.36.1 # keep in sync with the preview job
    steps:
      # The host kubeconfig lives in the repo; use the PR head ref so cleanup
      # works even when the PR was closed without merging.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.number }}/head
          persist-credentials: false

      - uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 1.36.4 # keep in sync with kubernetes_version in infra/env.hcl

      - name: Install vcluster CLI
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/vcluster-linux-amd64 \
            "https://github.com/loft-sh/vcluster/releases/download/${VCLUSTER_VERSION}/vcluster-linux-amd64"
          chmod +x /tmp/vcluster-linux-amd64
          sudo mv /tmp/vcluster-linux-amd64 /usr/local/bin/vcluster
          vcluster version

      - name: Prepare host kubeconfig
        run: |
          cp .github/host-kubeconfig.yaml /tmp/host-kubeconfig.yaml
          echo "KUBECONFIG_HOST=/tmp/host-kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Connect to vcluster
        env:
          KUBECONFIG: /tmp/host-kubeconfig.yaml
        run: |
          vcluster connect vcluster -n vcluster \
            --server https://vcluster.vcluster.svc:443 \
            --insecure \
            --print > /tmp/vcluster-kubeconfig.yaml
          echo "KUBECONFIG=/tmp/vcluster-kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Delete preview applications
        run: |
          kubectl -n argocd-preview delete applications \
            -l preview.homelab/pr=${{ github.event.number }} \
            --wait=false --ignore-not-found
