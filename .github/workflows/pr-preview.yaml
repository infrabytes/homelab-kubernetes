name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "platform/**"
      - "apps/**"
      - ".github/argocd-preview-values.yaml"
      - ".github/host-kubeconfig.yaml"

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: homelab-runner
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    env:
      VCLUSTER_VERSION: v0.37.0
      ARGOCD_DIFF_PREVIEW_VERSION: v0.2.14
      GH_CLI_VERSION: v2.100.0
      KIND_VERSION: v0.33.0
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.number }}/merge
          path: target-branch
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base-branch
          persist-credentials: false

      - uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 1.37.0 # keep in sync with kubernetes_version in infra/env.hcl

      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      # The CLIs below are installed per-run from the *_VERSION job env pins;
      # they are not part of the persisted tool cache.
      - name: Install vcluster CLI
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/vcluster-linux-amd64 \
            "https://github.com/loft-sh/vcluster/releases/download/${VCLUSTER_VERSION}/vcluster-linux-amd64"
          chmod +x /tmp/vcluster-linux-amd64
          sudo mv /tmp/vcluster-linux-amd64 /usr/local/bin/vcluster
          vcluster version

      - name: Install argocd-diff-preview
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/argocd-diff-preview.tar.gz \
            "https://github.com/dag-andersen/argocd-diff-preview/releases/download/${ARGOCD_DIFF_PREVIEW_VERSION}/argocd-diff-preview-Linux-x86_64.tar.gz"
          tar -xzf /tmp/argocd-diff-preview.tar.gz -C /tmp
          sudo mv /tmp/argocd-diff-preview /usr/local/bin/argocd-diff-preview
          argocd-diff-preview --version

      - name: Install gh CLI
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/${GH_CLI_VERSION}/gh_${GH_CLI_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/gh.tar.gz -C /tmp
          sudo mv "/tmp/gh_${GH_CLI_VERSION#v}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      # argocd-diff-preview requires a local cluster tool to be present for
      # its config validation even with --create-cluster=false; it is never
      # used to create a cluster in this workflow.
      - name: Install kind
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/kind-linux-amd64 \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x /tmp/kind-linux-amd64
          sudo mv /tmp/kind-linux-amd64 /usr/local/bin/kind
          kind version

      # The runner pod has no kubeconfig file; use the committed one, which
      # points at the host cluster through the pod's service account mount.
      - name: Prepare host kubeconfig
        run: |
          cp target-branch/.github/host-kubeconfig.yaml /tmp/host-kubeconfig.yaml
          kubectl --kubeconfig /tmp/host-kubeconfig.yaml get secret -n vcluster vc-vcluster
          echo "KUBECONFIG_HOST=/tmp/host-kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Connect to vcluster
        env:
          KUBECONFIG: /tmp/host-kubeconfig.yaml
        run: |
          vcluster connect vcluster -n vcluster \
            --server https://vcluster.vcluster.svc:443 \
            --insecure \
            --print > /tmp/vcluster-kubeconfig.yaml
          echo "KUBECONFIG=/tmp/vcluster-kubeconfig.yaml" >> "$GITHUB_ENV"

      # Idempotent: converges the in-vcluster ArgoCD instance on every run.
      # --force-conflicts: the vcluster syncer owns the helm.sh/chart label on the instance Services, so a chart bump SSA-apply conflicts forever without it.
      - name: Ensure ArgoCD in vcluster
        run: |
          for attempt in 1 2 3; do
            if helm upgrade --install argocd-preview argo-cd \
                --repo https://argoproj.github.io/argo-helm \
                --version 10.8.4 \
                --namespace argocd-preview \
                --create-namespace \
                --values target-branch/.github/argocd-preview-values.yaml \
                --force-conflicts \
                --wait --timeout 10m; then
              break
            fi
            echo "helm upgrade attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          kubectl -n argocd-preview rollout status deployment -l app.kubernetes.io/component=server --timeout=5m

      # ArgoCD's repo-server clones the private repo with this token; the
      # re-apply on every run also refreshes the short-lived GITHUB_TOKEN.
      - name: Ensure ArgoCD repository secret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl -n argocd-preview create secret generic pr-preview-repo \
            --from-literal=type=git \
            --from-literal=url=https://github.com/${{ github.repository }} \
            --from-literal=username=x-access-token \
            --from-literal=password="${GITHUB_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n argocd-preview label secret pr-preview-repo \
            argocd.argoproj.io/secret-type=repository --overwrite

      - name: Generate diff
        run: |
          argocd-diff-preview \
            --repo ${{ github.repository }} \
            --base-branch main \
            --target-branch refs/pull/${{ github.event.number }}/merge \
            --argocd-namespace=argocd-preview \
            --create-cluster=false

      - name: Comment diff
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          if [ ! -s output/diff.md ]; then
            echo "No diff was generated." > output/diff.md
          fi
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md --edit-last || \
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/diff.md
