name: PR Preview

on:
  # Runs on every PR (a required check cannot be path-filtered without leaving PRs pending); the changed-files step below gates the expensive work.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # GitHub-hosted, not the self-hosted scale set: the diff builds its own cluster,
    # needs no cluster access or host credentials, and this VM's native dockerd and
    # fast network are what make the ~2.5 GB of image pulls bearable.
    # Forks stay out: their token cannot write the PR comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      # Keep in sync with the argo-cd chart in infra/addons: the preview renders with production's Argo CD.
      ARGOCD_CHART_VERSION: 10.11.6
      ARGOCD_DIFF_PREVIEW_VERSION: v0.2.17
      GH_CLI_VERSION: v2.103.3
      KIND_VERSION: v0.33.0
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.number }}/merge
          path: target-branch
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base-branch
          persist-credentials: false

      # Everything below only runs when a GitOps-managed manifest changed; a skipped step still passes the check.
      - id: changed
        name: Detect GitOps changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          # The checkouts live in subdirectories; detect against the merge-ref one.
          path: target-branch
          files: |
            platform/**
            apps/**
            argocd/**
            charts/**

      # Installed per-run from the *_VERSION pins; not part of the persisted tool cache.
      - name: Install argocd-diff-preview
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/argocd-diff-preview.tar.gz \
            "https://github.com/dag-andersen/argocd-diff-preview/releases/download/${ARGOCD_DIFF_PREVIEW_VERSION}/argocd-diff-preview-Linux-x86_64.tar.gz"
          tar -xzf /tmp/argocd-diff-preview.tar.gz -C /tmp
          sudo mv /tmp/argocd-diff-preview /usr/local/bin/argocd-diff-preview
          argocd-diff-preview --version

      - name: Install gh CLI
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/${GH_CLI_VERSION}/gh_${GH_CLI_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf /tmp/gh.tar.gz -C /tmp
          sudo mv "/tmp/gh_${GH_CLI_VERSION#v}_linux_amd64/bin/gh" /usr/local/bin/gh
          gh --version

      - name: Install kind
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          set -eu
          curl -fSL --retry 3 -o /tmp/kind-linux-amd64 \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x /tmp/kind-linux-amd64
          sudo mv /tmp/kind-linux-amd64 /usr/local/bin/kind
          kind version

      # Builds its own kind cluster on this VM's dockerd and installs Argo CD into it; repo and charts are public, so the run needs no credentials.
      - name: Generate diff
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          set -eu
          attempt=0
          until argocd-diff-preview \
              --repo ${{ github.repository }} \
              --base-branch main \
              --target-branch refs/pull/${{ github.event.number }}/merge \
              --argocd-chart-version "${ARGOCD_CHART_VERSION}" \
              --argocd-config-dir target-branch/.github/argocd-config \
              --timeout 600; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 3 ]; then
              echo "argocd-diff-preview failed after 3 attempts"
              exit 1
            fi
            echo "diff attempt $attempt failed, retrying in 30s"
            sleep 30
          done

      # Found by marker, not --edit-last: the same bot also posts the breaking-change verdict.
      - name: Comment diff
        if: always() && steps.changed.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p output
          if [ ! -s output/diff.md ]; then
            echo "No diff was generated." > output/diff.md
          fi
          { echo '<!-- argocd-diff -->'; cat output/diff.md; } > output/comment.md
          id=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq 'map(select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- argocd-diff -->")))) | last | .id // empty' \
            | tail -1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@output/comment.md
          else
            gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --body-file output/comment.md
          fi
