name: Warm Runner Tool Cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/warm-tool-cache.yaml"
      - ".github/workflows/pre-commit.yaml"
      - ".pre-commit-config.yaml" # hook rev bumps re-warm the seed immediately
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  # This workflow is the only seed writer, so its own runs must not overlap.
  group: warm-tool-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: homelab-runner
    # Full rebuild (wipe + re-download + hook env builds) needs more headroom.
    timeout-minutes: 45
    steps:
      - name: Reset cache directories
        run: |
          # The seed must be a pure function of the current pins: wipe the
          # pod-local trees first; setup actions and pre-commit never prune
          # old versions, so every pin/rev bump would otherwise accumulate in
          # the published seed forever.
          sudo rm -rf /opt/tool-cache/local/runner /opt/tool-cache/local/mise /opt/tool-cache/local/pre-commit
          # The image tag is mutable, so the UID is derived at runtime.
          sudo mkdir -p /opt/tool-cache/local/runner /opt/tool-cache/local/mise /opt/tool-cache/local/pre-commit
          sudo chown -R "$(id -u):$(id -g)" /opt/tool-cache/local

      # Same actions and pins as pre-commit.yaml; installs land in the pod-local cache.
      - uses: Azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: 1.37.2 # keep in sync with kubernetes_version in infra/env.hcl

      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0

      # Same action as pre-commit.yaml; cache: false keeps the seed a pure function of these pins.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: 2026.7.7
          cache: false
          tool_versions: |
            terragrunt 1.2.1
            opentofu 1.13.9
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}

      - name: Verify cached tools
        run: |
          kubectl version --client
          helm version --short
          python3 --version
          tflint --version
          terragrunt --version
          tofu --version

      # Build the pre-commit hook environments once so fresh pods hydrate
      # them instead of pip/npm-installing per pod (the dominant cold cost).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pre-commit hook environments
        run: |
          python3 -m pip install pre-commit
          pre-commit install-hooks

      - name: Publish seed tarballs
        run: |
          # Atomic publish so concurrent hydrators never see a torn archive.
          for t in runner mise pre-commit; do
            if [ -d /opt/tool-cache/local/$t ]; then
              sudo tar czf /opt/tool-cache/seed/$t.tar.gz.tmp -C /opt/tool-cache/local/$t . && sudo mv /opt/tool-cache/seed/$t.tar.gz.tmp /opt/tool-cache/seed/$t.tar.gz
            fi
          done
