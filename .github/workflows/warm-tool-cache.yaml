name: Warm Runner Tool Cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/warm-tool-cache.yaml"
      - ".github/workflows/pre-commit.yaml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  # This workflow is the only seed writer, so its own runs must not overlap.
  group: warm-tool-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: homelab-runner
    timeout-minutes: 30
    steps:
      - name: Prepare cache directories
        run: |
          # The image tag is mutable, so the UID is derived at runtime.
          sudo mkdir -p /opt/tool-cache/local/runner /opt/tool-cache/local/mise /opt/tool-cache/local/pre-commit
          sudo chown -R "$(id -u):$(id -g)" /opt/tool-cache/local

      # Same actions and pins as pre-commit.yaml; installs land in the pod-local cache.
      - uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 1.37.0 # keep in sync with kubernetes_version in infra/env.hcl

      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      # tg_command omitted: the action acts as a pure tool installer.
      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3.4.1
        with:
          tg_version: 1.1.4
          tofu_version: 1.12.6

      - name: Verify cached tools
        run: |
          kubectl version --client
          helm version --short
          python3 --version
          tflint --version
          terragrunt --version
          tofu --version

      # Build the pre-commit hook environments once so fresh pods hydrate
      # them instead of pip/npm-installing per pod (the dominant cold cost).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pre-commit hook environments
        run: |
          python3 -m pip install pre-commit
          pre-commit install-hooks

      - name: Publish seed tarballs
        run: |
          # Atomic publish so concurrent hydrators never see a torn archive.
          for t in runner mise pre-commit; do
            if [ -d /opt/tool-cache/local/$t ]; then
              sudo tar czf /opt/tool-cache/seed/$t.tar.gz.tmp -C /opt/tool-cache/local/$t . && sudo mv /opt/tool-cache/seed/$t.tar.gz.tmp /opt/tool-cache/seed/$t.tar.gz
            fi
          done
