name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pre-commit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    # Fork PRs are arbitrary code and the runner holds a cluster credential; push to main is not a PR.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab-runner
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR base sha is always present for --from-ref.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3.4.1
        with:
          tg_version: 1.2.0
          tofu_version: 1.13.2
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: python3 -m pip install pyyaml==6.0.3
      - uses: bmuschko/setup-kubeconform@e5d264ec1eafe2314e750c429a9da7639dd5a003 # v1.1.0
        with:
          kubeconform-version: 0.8.0
      - name: Determine pre-commit range
        id: range
        run: |
          args="--all-files" # push to main: authoritative full run
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            # Full run when the base sha is unavailable or the diff touches
            # hook config (a changed-file run would otherwise lint nothing).
            # Every hook script counts: a hook's files: pattern never selects it.
            config_files='\.pre-commit-config\.yaml|\.yamllint\.yaml|\.secrets\.baseline|infra/cluster/\.tflint\.hcl'
            hook_scripts='\.github/scripts/.*'
            if git cat-file -e "$base^{commit}" 2>/dev/null \
               && ! git diff --name-only "$base" HEAD | grep -qxE "$config_files|$hook_scripts" \
               ; then
              args="--from-ref $base --to-ref HEAD"
            fi
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: ${{ steps.range.outputs.args }}
