name: renovate

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  # The run that updates a branch leaves it waiting on CI; nothing else would merge it until the next scheduled tick.
  workflow_run:
    workflows: [pre-commit, PR Preview]
    types: [completed]
  issues:
    types: [edited]
  pull_request:
    types: [edited]

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

env:
  RENOVATE_VERSION: 44.257.9

jobs:
  renovate:
    # Ticking a dashboard or PR checkbox starts a run; the bots' own rewrites of those bodies must not, or every run would loop.
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'renovate/')) ||
      (github.actor != 'infrabytes-renovate[bot]' && github.actor != 'renovate[bot]' &&
        ((github.event_name == 'issues' && github.event.issue.title == 'Dependency Dashboard') ||
         (github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'renovate/'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          # App installation token: a GITHUB_TOKEN PR would not trigger pre-commit/preview, stalling automerge.
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: ${{ env.RENOVATE_VERSION }}
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          # Env-only global config: renovate.json stays the repository config instead of doubling as global config.
          # The Factory Server app repo (infrabytes/factory) runs its own copy
          # of this workflow with the same App — one engine per repo, never
          # both, or they fight over the same renovate/* branches.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Registry auth for private-image lookups: the Factory Server image
          # (ghcr.io/infrabytes/factory-server) is private, so the docker
          # datasource needs a PAT with read:packages for that org to see its
          # tags (fine-grained PATs have no packages scope yet — classic only).
          RENOVATE_HOST_RULES: >-
            [{"hostType":"docker","matchHost":"ghcr.io/infrabytes/factory-server",
            "username":"x-access-token","password":"${{ secrets.RENOVATE_GHCR_TOKEN }}"}]
