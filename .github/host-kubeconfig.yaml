# Built from the ARC runner pod's own SA mount (breaking-change-analysis.yaml consumes it): pod-constant paths, no credentials.
apiVersion: v1
kind: Config
clusters:
  - cluster:
      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      server: https://kubernetes.default.svc
    name: host
contexts:
  - context:
      cluster: host
      user: arc-runner
    name: host
current-context: host
users:
  - name: arc-runner
    user:
      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
