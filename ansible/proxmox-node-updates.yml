- name: Rolling Proxmox host maintenance
  hosts: pve
  any_errors_fatal: true
  max_fail_percentage: 0
  serial: 1
  order: inventory
  gather_facts: true
  tasks:
    - name: Assert the Grafana credentials are available
      vars:
        env_stack_url: "{{ lookup('ansible.builtin.env', 'grafana_cloud_stack_url') }}"
        env_stack_token: "{{ lookup('ansible.builtin.env', 'grafana_cloud_stack_sa_token') }}"
        env_grafana_password: "{{ lookup('ansible.builtin.env', 'grafana_admin_password') }}"
      ansible.builtin.assert:
        that:
          - env_stack_url | length > 0
          - env_stack_token | length > 0
          - env_grafana_password | length > 0
        fail_msg: >-
          Missing grafana_cloud_stack_url / grafana_cloud_stack_sa_token /
          grafana_admin_password — wrap the run in
          `sops exec-env infra/secrets.sops.yaml`.
      when: inventory_hostname == (ansible_play_hosts_all | first)

    - name: Put the cluster alerts in downtime for the maintenance window
      vars:
        # Cluster alerts live in two Grafanas: the Cloud watchdog and the in-cluster instance that notifies Discord.
        silence_targets:
          - name: cloud
            base: "{{ lookup('ansible.builtin.env', 'grafana_cloud_stack_url') }}api/alertmanager/grafana/api/v2"
            headers:
              Authorization: "Bearer {{ lookup('ansible.builtin.env', 'grafana_cloud_stack_sa_token') }}"
          - name: local
            base: "{{ grafana_url }}/api/alertmanager/grafana/api/v2"
            headers:
              Authorization: "Basic {{ ('admin:' ~ lookup('ansible.builtin.env', 'grafana_admin_password')) | b64encode }}"
      ansible.builtin.uri:
        url: "{{ item.base }}/silences"
        method: POST
        headers: "{{ item.headers }}"
        body_format: json
        body:
          matchers:
            - name: grafana_folder
              value: Talos
              isRegex: false
              isEqual: true
          startsAt: "{{ ansible_date_time.iso8601 }}"
          endsAt: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime((ansible_date_time.epoch | int) + silence_duration_seconds) }}"
          createdBy: proxmox-node-updates
          comment: Rolling PVE host maintenance
        status_code: [200, 202]
      loop: "{{ silence_targets }}"
      loop_control:
        label: "{{ item.name }}"
      register: silence_result
      delegate_to: localhost
      when:
        - inventory_hostname == (ansible_play_hosts_all | first)
        - not ansible_check_mode
      failed_when: false

    - name: Patch and roll this host
      block:
        - name: Preflight gates
          ansible.builtin.include_tasks: tasks/preflight.yml
        - name: Apply upgrades
          ansible.builtin.include_tasks: tasks/patch.yml
        - name: Maintenance window (drain, VM stop, reboot)
          ansible.builtin.include_tasks: tasks/maintenance.yml
          when: reboot_required | bool
        - name: Report host result to Loki
          ansible.builtin.include_tasks: tasks/report.yml
        - name: Report run summary to Loki
          ansible.builtin.include_tasks: tasks/report_summary.yml
          when: inventory_hostname == (ansible_play_hosts_all | last)
        - name: Lift the maintenance silences
          vars:
            silences: >-
              {{ hostvars[(ansible_play_hosts_all | first)].silence_result.results
                 | default([]) | selectattr('json', 'defined')
                 | selectattr('json.silenceID', 'defined') | list }}
          ansible.builtin.uri:
            url: "{{ item.item.base }}/silence/{{ item.json.silenceID }}"
            method: DELETE
            headers: "{{ item.item.headers }}"
            status_code: [200, 404]
          loop: "{{ silences }}"
          loop_control:
            label: "{{ item.item.name }}"
          delegate_to: localhost
          when:
            - inventory_hostname == (ansible_play_hosts_all | last)
            - not ansible_check_mode
          failed_when: false
      rescue:
        - name: Report the failed host to Loki
          ansible.builtin.include_tasks: tasks/report_failure.yml
        - name: Lift the maintenance silences so the failure alerts fire
          vars:
            silences: >-
              {{ hostvars[(ansible_play_hosts_all | first)].silence_result.results
                 | default([]) | selectattr('json', 'defined')
                 | selectattr('json.silenceID', 'defined') | list }}
          ansible.builtin.uri:
            url: "{{ item.item.base }}/silence/{{ item.json.silenceID }}"
            method: DELETE
            headers: "{{ item.item.headers }}"
            status_code: [200, 404]
          loop: "{{ silences }}"
          loop_control:
            label: "{{ item.item.name }}"
          delegate_to: localhost
          when:
            - not ansible_check_mode
          failed_when: false
        - name: Abort the roll
          ansible.builtin.fail:
            msg: >-
              Host {{ inventory_hostname }} failed step
              '{{ ansible_failed_task.name }}'
              ({{ ansible_failed_result.msg | default('unknown error') }}) —
              remaining hosts skipped; the node is left cordoned if the
              failure came after the drain.
