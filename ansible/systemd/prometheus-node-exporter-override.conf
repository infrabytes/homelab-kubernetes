[Service]
# Root because the RAPL energy_uj files are 0400 root-only; with the
# packaged User=prometheus the rapl collector exports nothing.
User=root
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --collector.rapl.enable-zone-label
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=true
ProtectSystem=strict
