---
- name: Ensure the Atlantis namespace exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ atlantis_namespace }}"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Stage the Atlantis environment as a cluster Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: atlantis-env
        namespace: "{{ atlantis_namespace }}"
      type: Opaque
      stringData: "{{ atlantis_env }}"
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Ensure the argocd-manager service account exists
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: argocd-manager
        namespace: kube-system
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Grant argocd-manager cluster-admin
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: argocd-manager
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
      subjects:
        - kind: ServiceAccount
          name: argocd-manager
          namespace: kube-system
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

# cluster-admin, not a namespaced role: ArgoCD must create the namespace itself.
- name: Ensure a non-expiring token Secret exists for argocd-manager
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-manager-token
        namespace: kube-system
        annotations:
          kubernetes.io/service-account.name: argocd-manager
      type: kubernetes.io/service-account-token
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Read the argocd-manager token
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: v1
    kind: Secret
    name: argocd-manager-token
    namespace: kube-system
  register: argocd_manager_token
  until: argocd_manager_token.resources[0].data.token is defined
  retries: 12
  delay: 5
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: Read the cluster CA and token for the ArgoCD registration
  ansible.builtin.set_fact:
    windrunner_token: "{{ argocd_manager_token.resources[0].data.token | b64decode }}"
    windrunner_ca: "{{ (lookup('ansible.builtin.file', kubeconfig_path) | from_yaml).clusters[0].cluster['certificate-authority-data'] }}"
  when: not ansible_check_mode

- name: Render the ArgoCD cluster registration Secret
  ansible.builtin.copy:
    dest: "{{ cluster_secret_file }}"
    owner: "{{ windrunner_user }}"
    group: "{{ windrunner_user }}"
    mode: "0600"
    content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: cluster-windrunner
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: cluster
      type: Opaque
      stringData:
        name: windrunner
        server: {{ windrunner_api }}
        config: |
          {{ {'bearerToken': windrunner_token, 'tlsClientConfig': {'caData': windrunner_ca}} | to_json }}
  when: not ansible_check_mode

- name: Print the remaining manual step
  ansible.builtin.debug:
    msg:
      - "ArgoCD cluster registration written to {{ cluster_secret_file }}"
      - "Apply it from a host that holds the Talos kubeconfig:"
      - "  kubectl --kubeconfig infra/cluster/artifacts/kubeconfig apply -f {{ cluster_secret_file }}"
  when: not ansible_check_mode
