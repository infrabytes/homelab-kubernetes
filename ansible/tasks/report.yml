---
- name: Collect the host result line
  ansible.builtin.set_fact:
    host_line: >-
      host={{ inventory_hostname }}
      result={{ 'success' if not ansible_check_mode else 'check-mode' }}
      upgrades_applied={{ simulated_upgrade.stdout | length > 0 }}
      reboot={{ reboot_required | bool }}
      reboot_reason={{ reboot_reason if reboot_required | bool else 'none' }}
      drained={{ drain | bool and reboot_required | bool }}

- name: Push the host result to Loki
  ansible.builtin.uri:
    url: "{{ loki_url }}"
    method: POST
    url_username: "{{ grafana_cloud_loki_username }}"
    url_password: "{{ grafana_cloud_loki_token }}"
    force_basic_auth: true
    headers:
      Content-Type: application/json
    body_format: json
    body:
      streams:
        - stream:
            job: proxmox-node-updates
            host: "{{ inventory_hostname }}"
          values:
            - - "{{ ansible_date_time.epoch ~ '000000000' }}"
              - "{{ host_line }}"
    status_code: [200, 204]
  when: not ansible_check_mode
