apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/infrabytes/homelab-kubernetes
        revision: main
        directories:
          - path: platform/*
  template:
    metadata:
      name: "{{path.basename}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/infrabytes/homelab-kubernetes
        targetRevision: main
        path: "{{path}}"
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            maxDuration: 5m
            factor: 2
      # ClusterRoles with an aggregationRule get their `rules` populated by
      # the clusterrole-aggregation controller, so the live role always
      # differs from the manifest's empty rules (platform/cluster-viewer).
      # Ignoring the field keeps the app Synced; without it, the app would
      # be permanently OutOfSync with selfHeal churn. Scoped by name so
      # other platform apps' ClusterRoles keep their rules fully managed.
      ignoreDifferences:
        - group: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-viewer
          jqPathExpressions:
            - .rules
        - group: rbac.authorization.k8s.io
          kind: ClusterRole
          name: sealed-secrets-ui
          jqPathExpressions:
            - .rules
