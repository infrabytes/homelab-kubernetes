apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/infrabytes/homelab-kubernetes
    targetRevision: main
    path: platform
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Server-side apply: the vendored 1860 ConfigMap is 468 KB, over the 256KB last-applied-configuration limit.
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m
        factor: 2
  # The aggregation controller fills cluster-viewer's rules, so the live role never matches its empty manifest.
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-viewer
      jqPathExpressions:
        - .rules
