apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pdeu
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: pdeu-discord-bot project
  sourceRepos:
    - https://github.com/dhaustein/pdeu-discord-bot
  destinations:
    - name: in-cluster
      server: https://kubernetes.default.svc
      namespace: pdeu
  # Allow every *namespaced* resource …
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  # … which also denies every *cluster-scoped* resource.
  # RBAC stays out: ArgoCD applies as cluster-admin, so a RoleBinding here would escalate.
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
