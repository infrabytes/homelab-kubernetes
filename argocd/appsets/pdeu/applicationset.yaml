apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: pdeu
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/dhaustein/pdeu-discord-bot
        revision: main
        directories:
          - path: deploy
  template:
    metadata:
      name: pdeu-discord-bot
    spec:
      project: pdeu
      source:
        repoURL: https://github.com/dhaustein/pdeu-discord-bot
        targetRevision: main
        path: "{{path}}"
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: pdeu
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            maxDuration: 5m
            factor: 2
