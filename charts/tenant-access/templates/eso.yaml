apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "tenant is required" .Values.tenant }}-eso
  namespace: {{ required "namespace is required" .Values.namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-{{ required "tenant is required" .Values.tenant }}
  namespace: {{ required "namespace is required" .Values.namespace }}
spec:
  provider:
    openBao:
      server: https://openbao-public.openbao.svc:8200
      # The operator-generated in-cluster CA; the Secret is copied into this
      # namespace by the one-time runbook step (platform/openbao README).
      caProvider:
        type: Secret
        name: openbao-tls-ca
        key: ca.crt
      path: {{ required "tenant is required" .Values.tenant }}
      auth:
        kubernetes:
          path: kubernetes
          role: eso-{{ required "tenant is required" .Values.tenant }}
          serviceAccountRef:
            name: {{ required "tenant is required" .Values.tenant }}-eso
