# Plaintext http for bao.icaninto.space is never served: redirect to https.
# Only matches this hostname on the shared http listener (argocd's SWAG
# forwarding on the same listener is unaffected).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao-http-redirect
  namespace: openbao
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: http
  hostnames:
    - bao.icaninto.space
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
