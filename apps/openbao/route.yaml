apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openbao
  namespace: openbao
spec:
  parentRefs:
    # LAN only: the A record points at the gateway L2 IP (RFC1918, unroutable
    # publicly; keep the Cloudflare record DNS-only). TLS is terminated at the
    # gateway's openbao-https listener (cert-manager DNS-01, like argocd); the
    # http parentRef keeps plaintext LAN access working.
    - name: homelab
      namespace: gateway
      sectionName: https
    - name: homelab
      namespace: gateway
      sectionName: http
  hostnames:
    - bao.icaninto.space
  rules:
    - backendRefs:
        - name: openbao-active
          port: 8200
