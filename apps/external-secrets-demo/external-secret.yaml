# Plumbing proof: syncs secret/demo (kv-v2) via the namespaced store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo
  namespace: external-secrets-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-demo
    kind: SecretStore
  target:
    name: demo-secret
    creationPolicy: Owner
  data:
    - secretKey: demo-key
      remoteRef:
        key: secret/demo
        property: demo-key
