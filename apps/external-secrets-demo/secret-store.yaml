# Namespaced store: same OpenBao + role, but only this namespace can use it (no cluster-wide Secret read).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-demo
  namespace: external-secrets-demo
spec:
  provider:
    openBao:
      server: https://openbao-public.openbao.svc:8200
      # The operator-generated in-cluster CA; the Secret is copied into this
      # namespace by the one-time runbook step (platform/openbao README).
      caProvider:
        type: Secret
        name: openbao-tls-ca
        key: ca.crt
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-demo
          serviceAccountRef:
            name: eso-demo
