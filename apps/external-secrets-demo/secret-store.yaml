# Namespaced store: same OpenBao + role, but only this namespace can use it (no cluster-wide Secret read).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-demo
  namespace: external-secrets-demo
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-demo
          serviceAccountRef:
            name: eso-demo
