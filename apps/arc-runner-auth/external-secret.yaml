# ARC runner PAT from OpenBao (secret/arc-runner-auth); ESO owns the Secret (creationPolicy Owner).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-runner-auth
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-arc-runners
    kind: SecretStore
  target:
    name: arc-runner-auth
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: arc-runner-auth
        property: github_token
