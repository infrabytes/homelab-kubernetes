# Namespaced store: only this namespace's ExternalSecrets reach the runner PAT path (OpenBao policy eso-arc-runners).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-arc-runners
  namespace: arc-runners
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-arc-runners
          serviceAccountRef:
            name: arc-runners-eso
