apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # A controller value other than "dns-controller" opts the object out of
    # external-dns; the prefix moved to external-dns.kubernetes.io/ in v0.22,
    # which ignores the legacy external-dns.alpha.kubernetes.io key.
    # Served publicly via the edge SWAG hostnames (Cloudflare record points at
    # the SWAG target; LAN clients use a router-local override to the gateway L2
    # IP), so external-dns must not republish this record as the cluster's
    # RFC1918 gateway IP.
    external-dns.kubernetes.io/controller: "manual-dns"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: https
    # Serves traffic forwarded by the edge SWAG instance (TLS terminated there,
    # plain HTTP with original Host header from the LAN).
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: http
  hostnames:
    - argocd.icaninto.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: argocd-server
          port: 80
          weight: 1
