apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # external-dns ignores any route carrying a controller annotation with a
    # value other than "dns-controller" (the documented, gateway-source-
    # implemented mechanism; there is no "exclude" annotation in external-dns).
    # Served publicly via the edge SWAG hostnames (Cloudflare record points at
    # the SWAG target; LAN clients use a router-local override to the gateway
    # L2 IP). external-dns must not keep republishing this record as the
    # cluster's RFC1918 gateway IP; with policy=sync it deletes its owned
    # A/TXT records on the next sync after this annotation lands.
    external-dns.alpha.kubernetes.io/controller: "manual-dns"
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: https
    # Serves traffic forwarded by the edge SWAG instance (TLS terminated there,
    # plain HTTP with original Host header from the LAN).
    - name: homelab
      namespace: gateway
      sectionName: http
  hostnames:
    - argocd.icaninto.space
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
