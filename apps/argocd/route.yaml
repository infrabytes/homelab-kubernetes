apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: https
    # Serves traffic forwarded by the edge SWAG instance (TLS terminated there,
    # plain HTTP with original Host header from the LAN).
    - name: homelab
      namespace: gateway
      sectionName: http
  hostnames:
    - argocd.icaninto.space
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
