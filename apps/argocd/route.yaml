apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # Served publicly via the edge SWAG hostnames (Cloudflare record points at
    # the SWAG target; LAN clients use a router-local override to the gateway
    # L2 IP). Keep external-dns from owning this record: with policy=sync it
    # would republish it as the cluster's RFC1918 gateway IP.
    external-dns.alpha.kubernetes.io/exclude: "true"
spec:
  parentRefs:
    - name: homelab
      namespace: gateway
      sectionName: https
    # Serves traffic forwarded by the edge SWAG instance (TLS terminated there,
    # plain HTTP with original Host header from the LAN).
    - name: homelab
      namespace: gateway
      sectionName: http
  hostnames:
    - argocd.icaninto.space
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
