# Public + LAN, the argocd pattern: the edge SWAG host terminates public TLS
# (Cloudflare record -> SWAG, kept out of external-dns via manual-dns) and
# forwards plain HTTP with the original Host header to the gateway's http
# listener. LAN clients reach the VIP through a router DNS override; tailnet
# clients take the public path. The https listener keeps the factory-tls cert
# for direct gateway access.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: factory
  namespace: factory
  annotations:
    external-dns.kubernetes.io/controller: "manual-dns"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: http
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: factory-https
  hostnames:
    - factory.icaninto.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: factory-server
          port: 80
          weight: 1
