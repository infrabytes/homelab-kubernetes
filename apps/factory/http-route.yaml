# Internal-only, served from the gateway VIP like grafana/bao: no manual-dns
# annotation, so external-dns publishes factory.icaninto.space to the gateway
# VIP — LAN clients resolve it via the public record, tailnet clients reach the
# VIP through the lan-subnet-router's 192.168.0.200/32 advertisement. When this
# goes public, the edge SWAG host takes over TLS and the route moves to the
# public-path pattern used by argocd (manual-dns + both listeners).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: factory
  namespace: factory
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: factory-https
  hostnames:
    - factory.icaninto.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: factory-server
          port: 80
          weight: 1
