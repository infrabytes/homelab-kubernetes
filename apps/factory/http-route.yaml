# Internal-only for now: the manual-dns annotation opts the record out of
# external-dns so no public Cloudflare entry is published. LAN clients reach the
# gateway VIP (192.168.0.200) via a router DNS override for
# factory.icaninto.space. When this goes public, the edge SWAG host forwards to
# the http listener and the annotation moves to the public-path pattern used by
# argocd.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: factory
  namespace: factory
  annotations:
    external-dns.kubernetes.io/controller: "manual-dns"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: homelab
      namespace: gateway
      sectionName: factory-https
  hostnames:
    - factory.icaninto.space
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: factory-server
          port: 80
          weight: 1
