# Values are hand-seeded in OpenBao at secret/factory (ESO's OpenBao provider is
# read-only): better_auth_secret, credential_encryption_key, authentik_client_secret
# and the self-created GitHub App (github_app_*; the integration activates once
# all five app values plus the webhook secret are present).
# The encryption key must never change after first use — losing it makes stored
# credentials (model providers, integrations) unreadable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-env
  namespace: factory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-factory
    kind: SecretStore
  target:
    name: factory-env
    creationPolicy: Owner
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: factory
        property: better_auth_secret
    - secretKey: FACTORY_CREDENTIAL_ENCRYPTION_KEY
      remoteRef:
        key: factory
        property: credential_encryption_key
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: factory
        property: authentik_client_secret
    - secretKey: GITHUB_APP_ID
      remoteRef:
        key: factory
        property: github_app_id
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: factory
        property: github_app_private_key
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef:
        key: factory
        property: github_app_client_id
    - secretKey: GITHUB_APP_CLIENT_SECRET
      remoteRef:
        key: factory
        property: github_app_client_secret
    - secretKey: GITHUB_APP_SLUG
      remoteRef:
        key: factory
        property: github_app_slug
    - secretKey: GITHUB_APP_WEBHOOK_SECRET
      remoteRef:
        key: factory
        property: github_app_webhook_secret
    # Read-only viewer kubeconfig (infra/viewer-kubeconfig, client cert for the
    # cluster-viewer ClusterRole): consumed by the cluster_kubectl session tool.
    # The client key stays inside the server process; it never reaches sandbox
    # env or sessions.
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: factory
        property: openrouter_api_key
    - secretKey: VIEWER_KUBECONFIG
      remoteRef:
        key: factory
        property: viewer_kubeconfig
---
# ghcr.io pull credential for the private factory-server image. The
# dockerconfigjson blob (ghcr.io entry only) is hand-seeded in OpenBao at
# secret/factory: ghcr_dockerconfigjson — build it with:
#   echo -n '<user>:<PAT>' | base64   # the auth value
#   echo '{"auths":{"ghcr.io":{"username":"<user>","password":"<PAT>","auth":"<auth>"}}}'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-registry
  namespace: factory
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-factory
    kind: SecretStore
  target:
    name: factory-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .ghcr_dockerconfigjson }}"
  data:
    - secretKey: ghcr_dockerconfigjson
      remoteRef:
        key: factory
        property: ghcr_dockerconfigjson
