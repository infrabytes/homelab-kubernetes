# ServiceAccount factory-env authenticates the namespaced store; its OpenBao
# policy/role (eso-factory) is created by the OpenBao chart's postStart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-env
  namespace: factory
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-factory
  namespace: factory
spec:
  provider:
    openBao:
      server: https://openbao-public.openbao.svc:8200
      # The operator-generated in-cluster CA; the Secret is copied into this
      # namespace by the one-time runbook step (platform/openbao README).
      caProvider:
        type: Secret
        name: openbao-tls-ca
        key: ca.crt
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-factory
          serviceAccountRef:
            name: factory-env
