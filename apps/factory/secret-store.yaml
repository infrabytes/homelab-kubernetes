# ServiceAccount factory-env authenticates the namespaced store; its OpenBao
# policy/role (eso-factory) is created by the OpenBao chart's postStart.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-env
  namespace: factory
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-factory
  namespace: factory
spec:
  provider:
    openBao:
      server: http://openbao.openbao.svc:8200
      path: secret
      auth:
        kubernetes:
          path: kubernetes
          role: eso-factory
          serviceAccountRef:
            name: factory-env
