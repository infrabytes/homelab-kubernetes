apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-server
  namespace: factory
spec:
  replicas: 1
  # Rolling updates deadlock on the sandboxes PVC: a new pod cannot attach the
  # RWO volume while the old one still runs. Recreate frees it first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: factory-server
  template:
    metadata:
      labels:
        app: factory-server
    spec:
      # ghcr.io is private: ESO composes the pull credential from OpenBao.
      imagePullSecrets:
        - name: factory-registry
      # The OpenBao factory-app-writer kubernetes role is bound to this SA.
      serviceAccountName: factory-server
      # CSI mounts the sandboxes PVC root-owned; fsGroup hands it to the
      # server's uid 1000 group (kubelet chowns on mount). OnRootMismatch
      # skips the recursive walk on warm mounts.
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: server
          image: ghcr.io/bbayrakt/factory-server:0.1.5
          imagePullPolicy: IfNotPresent
          # uid 1000 is the image's `node` user; the sandbox PVC is mounted at
          # its home. Root filesystem stays writable: git checkouts need it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            # Public origin: auth callback (Authentik redirect URI) and the
            # GitHub App webhook target are built from this value.
            - name: MASTRACODE_PUBLIC_URL
              value: https://factory.icaninto.space
            # Public issuer: authentik.icaninto.space resolves to the Cloudflare
            # edge from in-cluster, so discovery + authorize use the same URLs
            # the browser sees.
            - name: AUTHENTIK_URL
              value: https://authentik.icaninto.space
            - name: AUTHENTIK_APP_SLUG
              value: factory
            # The Blueprint-managed provider's client_id (platform/authentik).
            - name: AUTHENTIK_CLIENT_ID
              value: factory
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # CNPG-generated app connection string (includes the uri key).
                  name: factory-pg-app
                  key: uri
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: factory-env
                  key: BETTER_AUTH_SECRET
            - name: FACTORY_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: factory-env
                  key: FACTORY_CREDENTIAL_ENCRYPTION_KEY
            - name: AUTHENTIK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: factory-env
                  key: AUTHENTIK_CLIENT_SECRET
            # Self-created GitHub App: the integration activates only when all
            # six values are present (githubAppConfigured in the entry).
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: factory-env
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: factory-env
                  key: GITHUB_APP_PRIVATE_KEY
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: factory-env
                  key: GITHUB_APP_CLIENT_ID
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: factory-env
                  key: GITHUB_APP_CLIENT_SECRET
            - name: GITHUB_APP_SLUG
              valueFrom:
                secretKeyRef:
                  name: factory-env
                  key: GITHUB_APP_SLUG
            - name: GITHUB_APP_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: factory-env
                  key: GITHUB_APP_WEBHOOK_SECRET
            # Read-only viewer kubeconfig for the cluster_kubectl session tool.
            - name: VIEWER_KUBECONFIG
              valueFrom:
                secretKeyRef:
                  name: factory-env
                  key: VIEWER_KUBECONFIG
          # 2h since deploy (2026-11-19..2026-11-20): mem p95 1780Mi, peak 1993Mi
          # -> 1792Mi/2688Mi. The peak is the fastembed/ONNX embedding footprint;
          # the 1.25x-peak floor (2492Mi) is below 1.5x request, so the latter wins.
          # Raised 2026-11-20 (initial estimate, no browser-E2E history yet):
          # sandbox Chromium (E2E_BROWSER, image 0.1.4) runs in this pod and
          # spikes ~1Gi on top of the measured peak; limit = 4Gi headroom over
          # peak+Chromium, request rounded up to 64Mi. Re-measure after two weeks.
          resources:
            requests:
              cpu: 500m
              memory: 2560Mi
            limits:
              memory: 4Gi
          ports:
            - containerPort: 3000
              name: http
          # readOnlyRootFilesystem would break git checkouts; omitted deliberately.
          volumeMounts:
            # LocalFactorySandbox root ($HOME/.mastracode/web/sandboxes): agent
            # session checkouts and installed dependencies survive pod rolls.
            # WARNING (template README): local sandboxes run agent commands as
            # the server user inside this pod. Acceptable for a homelab; swap
            # for an isolated provider (e.g. E2B) if this becomes multi-tenant.
            - name: sandboxes
              mountPath: /home/node/.mastracode
      volumes:
        - name: sandboxes
          persistentVolumeClaim:
            claimName: factory-sandboxes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: factory-sandboxes
  namespace: factory
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
