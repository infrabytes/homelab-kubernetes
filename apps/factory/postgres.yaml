apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: factory-pg
  namespace: factory
spec:
  instances: 2
  # 2 instances: the standby keeps authentik up through node drains/upgrades;
  # required anti-affinity keeps it off the primary's node. The operator PDB
  # (minAvailable instances-1) now allows exactly one eviction — with 1
  # instance it could only block drains, hence enablePDB was off.
  enablePDB: true
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  # The official CNPG image ships the pgvector extension; enabled by
  # postInitApplicationSQL below.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.9
  storage:
    size: 5Gi
    storageClass: longhorn
  # Initial estimate (2026-11-19); re-measure after two weeks. Holds Factory work items,
  # sessions and the vector store — sized like the other single-purpose CNPG clusters.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      owner: factory
      database: factory
      # postInitSQL runs in the postgres database (measured on the first
      # bootstrap); the application database needs postInitApplicationSQL.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
